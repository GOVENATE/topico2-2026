name: Guardia

# Corre en cada push de cualquier rama y en cada PR.
# Si algo falla queda en rojo y esa rama no se debe pasar a main.

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Archivos que cambian en el PR
        id: cambios
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" > cambios.txt
          elif [ "${{ github.ref_name }}" != "main" ]; then
            git diff --name-only --diff-filter=ACMR "origin/main...HEAD" > cambios.txt
          else
            find grupos -type f > cambios.txt
          fi
          echo "Archivos:"
          cat cambios.txt
          echo "total=$(wc -l < cambios.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Los alumnos solo pueden tocar su carpeta. El dueno del repo se salta esta regla.
      - name: Revision de archivos
        env:
          QUIEN: ${{ github.event.pull_request.user.login || github.actor }}
          DUENO: ${{ github.repository_owner }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          flag=""
          if [ "$QUIEN" != "$DUENO" ] && [ "$RAMA" != "main" ]; then
            flag="--una-carpeta"
          fi
          if [ -s cambios.txt ]; then
            tr '\n' '\0' < cambios.txt | xargs -0 node scripts/revisar-seguridad.mjs $flag
          else
            echo "No hay archivos que revisar."
          fi

      - name: Validar alumno.json
        run: node scripts/armar-catalogo.mjs --estricto

      - name: Instalar ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam

      - name: Antivirus
        run: |
          if [ -s cambios.txt ] && [ "${{ github.ref_name }}" != "main" ]; then
            xargs -d '\n' -a cambios.txt clamscan --infected --no-summary=no
          else
            clamscan -r --infected grupos
          fi
