name: Guardia

# Corre en cada PR. Si algo falla, el PR queda en rojo y no se debe hacer merge.
# Activa en Settings > Branches una regla para main que exija que pase "guardia".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Archivos que cambian en el PR
        id: cambios
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" > cambios.txt
          else
            find grupos -type f > cambios.txt
          fi
          echo "Archivos:"
          cat cambios.txt
          echo "total=$(wc -l < cambios.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Los alumnos solo pueden tocar su carpeta. Los mantenedores
      # (los que estan en CODEOWNERS / con permiso de escritura) se saltan esta regla.
      - name: Revision de archivos
        env:
          ES_PR: ${{ github.event_name == 'pull_request' }}
          ASOCIACION: ${{ github.event.pull_request.author_association }}
        run: |
          flag=""
          if [ "$ES_PR" = "true" ] && [ "$ASOCIACION" != "OWNER" ] && [ "$ASOCIACION" != "MEMBER" ] && [ "$ASOCIACION" != "COLLABORATOR" ]; then
            flag="--una-carpeta"
          fi
          if [ -s cambios.txt ]; then
            tr '\n' '\0' < cambios.txt | xargs -0 node scripts/revisar-seguridad.mjs $flag
          else
            echo "No hay archivos que revisar."
          fi

      - name: Validar alumno.json
        run: node scripts/armar-catalogo.mjs --estricto

      - name: Instalar ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam

      - name: Antivirus
        run: |
          if [ -s cambios.txt ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            xargs -d '\n' -a cambios.txt clamscan --infected --no-summary=no
          else
            clamscan -r --infected grupos
          fi
