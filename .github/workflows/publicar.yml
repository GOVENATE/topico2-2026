name: Publicar sitio

# Cada push a main compila el sitio (Astro) y deja las paginas ya listas
# en la raiz de main (index.html, 404.html, g/, _astro/).
# Asi Hostinger puede desplegar main directamente, sin compilar nada.
# Los archivos de los alumnos (grupos/) ya estan en la raiz.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'g/**'
      - '_astro/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Copiar paginas compiladas a la raiz
        run: |
          rm -rf g _astro index.html 404.html
          cp -r dist/g dist/_astro dist/index.html dist/404.html .

      - name: Commit si hubo cambios
        run: |
          git config user.name "GOVENATE"
          git config user.email "GOVENATE@users.noreply.github.com"
          git add -A g _astro index.html 404.html data/catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el sitio."
          else
            git commit -m "Publicar sitio [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
