.det .tx{min-width:0}

var data={
c4:{cap:'Capítulo 4',tit:'Comunicación',pts:[
['Qué es','chat','Es un proceso para intercambiar ideas, sentimientos y emociones, donde se comparten significados. Incluye contexto, participantes, mensaje, canales, barreras y realimentación.'],
['7 pasos','pasos','Según Robbins, la comunicación tiene siete pasos: fuente, codificación, mensaje, canal, decodificación, receptor y realimentación.'],
['Funciones','engranes','En un grupo u organización la comunicación sirve para cuatro cosas: expresión emocional, motivación, control e información.'],
['Asertividad','check','Es decir lo que sientes, piensas y necesitas de forma directa y honesta, sin agredir ni pasar por encima de los derechos de los demás. Asertividad es igual a autoestima.'],
['No verbal','ojo','Son los gestos, la postura, el tono de voz, la ropa y hasta el lugar. Puede repetir, contradecir, sustituir o complementar lo que decimos con palabras.'],
['Escuchar','oreja','Para escuchar bien: haz contacto visual, pregunta, asiente, repite con tus palabras lo que te dijeron, no interrumpas, no hables mucho y toma notas si hace falta.']]},
c5:{cap:'Capítulo 5',tit:'Administración del tiempo',pts:[
['El tiempo','reloj','Tiene seis características: es igualitario, inelástico, indispensable, insustituible, inexorable e invaluable. El día tiene 24 horas para todos.'],
['Administrarlo','brujula','Es hacer que el tiempo sirva para nuestro beneficio. Mauro Rodríguez dice que administrar el tiempo es administrar la vida, y malgastarlo es malgastar la vida.'],
['Matriz','cuadricula','Covey divide las actividades en cuatro cuadrantes: urgente e importante, importante pero no urgente, urgente pero no importante, y ni urgente ni importante. Lo ideal es trabajar en el cuadrante II.'],
['Roles','balanza','Cada rol que tenemos lleva cuatro necesidades: física, espiritual, social y mental. El directivo busca el equilibrio entre las cuatro y se pone metas semanales.'],
['Ladrones','muro','Planear mal, no poner prioridades, no saber decir no, no delegar, dejar las cosas para después, las interrupciones y usar internet sin un fin.'],
['Mitos','rayo','Mitos que roban tiempo: el activismo (el más ocupado es el más eficiente), el centralismo, esperar a tener todos los datos, la puerta siempre abierta y ver al tiempo como enemigo.']]},
c6:{cap:'Capítulo 6',tit:'Creatividad',pts:[
['Qué es','foco','Es descubrir o producir algo nuevo, valioso y útil a partir de lo que ya conocemos. No es solo de genios: todos la tenemos y se puede entrenar.'],
['Divergente','espiral','El pensamiento convergente busca una sola respuesta correcta. El divergente saca muchas ideas de un punto y se mide por fluidez, flexibilidad y originalidad.'],
['Fases','pasos','Orientación, preparación, incubación, iluminación, verificación y comunicación. Si la idea no funciona, se regresa a la incubación.'],
['Persona','estrella','Una persona creativa es curiosa, está abierta a experiencias nuevas, se atreve a tomar riesgos, es persistente, tolera la ambigüedad y tiene autoestima alta.'],
['Frenos','muro','En la persona: miedo a equivocarse, la rutina y los estereotipos. En la organización: vigilancia constante, exceso de control y falta de reconocimiento.'],
['Despertarla','flor','Hazte preguntas, lee de otros temas, conócete, ríete más, conoce lugares y personas nuevas, y haz lluvia de ideas en equipo.']]},
c9:{cap:'Capítulo 9',tit:'Liderazgo',pts:[
['Qué es','bandera','Es influir en la gente para que trabaje con gusto por los objetivos del grupo. Líder viene de leader, que indica acción: es quien guía a su equipo hacia una meta común.'],
['Mando','personas','Hay tres estilos de mando. Autocrático: ordena y espera obediencia. Democrático: delega y hace participar a todos. Laissez-faire: deja libertad total y casi no participa.'],
['Funciones','engranes','El líder debe comunicar, organizar, integrar, dirigir, controlar y motivar. Todo líder es motivador: hace que los otros hagan.'],
['Poder','corona','Puede ser de posición (viene de arriba) o personal (se lo reconoce la gente). Tipos: coerción, conexión, recompensa, legitimidad, información, negociación, experto y afecto.'],
['Estilos','caras','Hay cinco estilos de liderazgo: estructurador, entrenador, alentador, delegador y carismático. Cada uno funciona mejor según cómo sea el equipo.'],
['Actitudes','estrella','Kouzes y Posner proponen cinco actitudes: desafiar el proceso, inspirar una visión compartida, capacitar a otros, servir de modelo y brindar aliento.']]},
c11:{cap:'Capítulo 11',tit:'Motivación',pts:[
['Qué es','rayo','Viene del latín motus, “lo que mueve”. Es la fuerza que da energía, dirige y mantiene nuestro comportamiento.'],
['Proceso','pasos','Una necesidad crea un deseo, el deseo crea una tensión, la tensión lleva a una acción y la acción busca la satisfacción.'],
['Reconocer','corazon','El dinero motiva, pero por poco tiempo. En estudios en el occidente de México, lo que más motiva a los trabajadores es que reconozcan su trabajo y respeten su función.'],
['Maslow','piramide','Pirámide de cinco necesidades: fisiológicas, seguridad, sociales, estima y autorrealización. Las de arriba aparecen cuando las de abajo ya están cubiertas.'],
['Teorías','libro','McClelland: logro, poder y afiliación. Vroom (expectativas): me esfuerzo si creo que habrá recompensa. Adams (equidad): comparo lo que doy y recibo con lo de otros.'],
['Interna/externa','balanza','La motivación intrínseca nace de uno mismo, por el gusto de hacer la tarea. La extrínseca viene de fuera: dinero, premios o castigos.']]},
c12:{cap:'Capítulo 12',tit:'La habilidad estratégica',pts:[
['Qué es','diana','La estrategia es el conjunto de procedimientos para llevar a cabo un plan o una tarea. Implica dirigirse y controlarse uno mismo según los objetivos.'],
['El estratega','lupa','Va al fondo de las cosas, lee mucho, juega con las ideas, pregunta sin miedo, usa la intuición y la razón, y se rodea de gente con ideas diferentes.'],
['Liderazgo','brujula','El liderazgo estratégico es la capacidad de anticipar, visualizar, ser flexible y dar autoridad a otros para hacer cambios cuando hace falta.'],
['Mapa','camino','El mapa de estrategia empieza con un autodiagnóstico: ¿quién soy? y ¿a dónde voy? Después el directivo define la estrategia, determina la acción y alcanza la meta.'],
['Variables','pilares','Una estrategia se revisa en cuatro variables: financiera, de clientes, de procesos internos y de crecimiento y aprendizaje.'],
['Flexibilidad','espiral','Si la estrategia no da resultados hay que replantearla. El estratega siempre se pregunta: ¿qué hacemos?, ¿cómo lo hacemos?, ¿para qué? y ¿debemos cambiar?']]}};

    '<div class="det"><div class="tx"><span class="hint">Toca un punto para ver la información.</span></div></div>';
  function pick(g){
    var i=+g.getAttribute('data-i'),p=d.pts[i];
    el.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on')});
    el.querySelectorAll('.conn').forEach(function(x){x.classList.remove('on')});
    g.classList.add('on');
    document.getElementById(k+'l'+i).classList.add('on');
    el.querySelector('.det').innerHTML='<div class="ic"><svg viewBox="0 0 48 48" aria-hidden="true">'+ico[p[1]]+'</svg></div><div class="tx"><b>'+p[0]+'</b>'+p[2]+'</div>';
  }
  el.querySelectorAll('.pill').forEach(function(g){
    g.addEventListener('click',function(){pick(g)});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g)}});
  });
});
</script>
</body>
</html>
