<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expediente de Análisis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ebe1;
    --bg-dot:#dcdfd1;
    --paper:#f8f6ef;
    --paper-2:#f1efe6;
    --ink:#1e2b22;
    --ink-soft:#4b5c4e;
    --ink-faint:#8a9488;
    --line:#c7cdba;
    --accent:#3e6259;
    --accent-ink:#f4f2e8;
    --gold:#b9932b;
    --brick:#8b3a3a;
    --white-hat:#e7e4d6;
    --red-hat:#a5443f;
    --black-hat:#26241f;
    --yellow-hat:#c99a2e;
    --green-hat:#4c6b45;
    --blue-hat:#33566e;
    --radius:2px;
    --shadow: 0 1px 0 rgba(30,43,34,0.06), 0 8px 24px -12px rgba(30,43,34,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(var(--bg-dot) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:34px;
  }
  .masthead .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .masthead .brand b{color:var(--ink);}
  .masthead .case-no{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:.08em;
    text-align:right;
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
    display:block;
  }
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.03em;
    padding:12px 22px;
    border-radius:var(--radius);
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    transition:background .15s, color .15s, transform .1s;
  }
  .btn:hover{background:var(--ink);color:var(--accent-ink);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.primary:hover{background:#345048;border-color:#345048;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:hover{background:transparent;color:var(--ink);}
  .btn.primary:disabled:hover{background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{border-color:var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--ink-soft);color:var(--accent-ink);border-color:var(--ink-soft);}
  .btn.small{padding:8px 14px;font-size:11.5px;}

  /* ---------- COVER ---------- */
  .cover-hero{
    background:var(--paper);
    border:1.5px solid var(--ink);
    box-shadow:var(--shadow);
    padding:52px 44px;
    position:relative;
  }
  .cover-hero::before{
    content:"";position:absolute;top:14px;right:14px;width:34px;height:34px;
    border:1.5px solid var(--ink-faint);border-radius:50%;
    opacity:.5;
  }
  .cover-hero h1{font-size:40px;line-height:1.08;max-width:520px;}
  .cover-hero p.lede{
    color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:520px;margin-top:16px;
  }
  .field{margin-top:28px;}
  .field label{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;
  }
  .field input, .field textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    border-radius:var(--radius);
    resize:vertical;
  }
  .field input:focus, .field textarea:focus, textarea.qbox:focus{
    outline:none;border-color:var(--accent);
  }
  .cover-steps{
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:38px;
    border-top:1px solid var(--line);padding-top:18px;
  }
  .cover-steps div{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    border-left:1px solid var(--line);padding-left:12px;line-height:1.5;
  }
  .cover-steps div:first-child{border-left:none;padding-left:0;}
  .cover-steps b{display:block;color:var(--ink);font-size:16px;font-family:'Fraunces',serif;font-weight:600;}
  .cover-actions{margin-top:36px;display:flex;align-items:center;gap:16px;}
  .hint{font-size:12.5px;color:var(--ink-faint);}

  /* ---------- QUESTIONS ---------- */
  .folio-bar{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
  }
  .folio-tag{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    letter-spacing:.06em;
  }
  .progress-track{
    height:3px;background:var(--line);width:100%;margin-top:10px;position:relative;
  }
  .progress-fill{height:3px;background:var(--gold);transition:width .25s ease;}
  .cat-pill{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);padding:4px 9px;border-radius:20px;margin-bottom:18px;
  }
  .question-card{
    background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow);
    padding:40px 40px 32px;
  }
  .question-card h2{font-size:25px;line-height:1.35;max-width:600px;}
  textarea.qbox{
    width:100%;min-height:130px;margin-top:22px;font-size:15px;line-height:1.55;
    padding:14px;border:1.5px solid var(--line);background:var(--paper-2);border-radius:var(--radius);
    font-family:'Inter',sans-serif;
  }
  .qnav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;}
  .qnav .right{display:flex;gap:10px;align-items:center;}

  /* ---------- LOADING ---------- */
  .loading-box{
    background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow);
    padding:70px 40px;text-align:center;
  }
  .stamp-spin{
    width:56px;height:56px;border:2px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;margin:0 auto 22px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-box p{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;}
  .error-box{
    background:#f6ece9;border:1.5px solid var(--brick);color:var(--brick);
    padding:20px 24px;font-size:13.5px;margin-top:18px;font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- HUB ---------- */
  .hub-head{margin-bottom:30px;}
  .hub-head h1{font-size:30px;}
  .hub-head p{color:var(--ink-soft);font-size:14.5px;margin-top:8px;max-width:560px;}
  .folder-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
  }
  @media(max-width:700px){.folder-grid{grid-template-columns:repeat(2,1fr);}}
  .folder{
    position:relative;
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:22px 18px 20px;
    min-height:150px;
    display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .folder::before{
    content:attr(data-tab);
    position:absolute;top:-13px;left:16px;
    background:var(--ink);color:var(--accent-ink);
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;
    padding:4px 9px;text-transform:uppercase;
  }
  .folder:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .folder .fmark{
    font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--accent);
  }
  .folder h3{font-size:16.5px;margin-top:14px;line-height:1.25;}
  .folder p{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .folder .status{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:6px;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
  .status.ready{color:var(--accent);}
  .status.ready .dot{background:var(--accent);}
  .folder.author{background:var(--paper-2);}

  .hub-footer{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;}

  /* ---------- DETAIL ---------- */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
  .detail-title .eyebrow{margin-bottom:6px;}
  .detail-title h1{font-size:30px;}
  .stamp{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    border:2px solid var(--accent);color:var(--accent);padding:8px 12px;border-radius:50%;
    transform:rotate(-6deg);white-space:nowrap;
  }
  .detail-panel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow);padding:32px;}

  /* FODA */
  .foda-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ink);border:1.5px solid var(--ink);}
  @media(max-width:600px){.foda-grid{grid-template-columns:1fr;}}
  .foda-cell{background:var(--paper);padding:22px;}
  .foda-cell h4{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .foda-cell.f h4{color:var(--accent);} .foda-cell.o h4{color:var(--gold);}
  .foda-cell.d h4{color:var(--ink-soft);} .foda-cell.a h4{color:var(--brick);}
  .foda-cell ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink);}
  .foda-cell li{margin-bottom:6px;}

  /* CATWOE */
  .catwoe-row{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);}
  .catwoe-row:last-child{border-bottom:none;}
  .catwoe-label{width:170px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:.04em;}
  .catwoe-label small{display:block;color:var(--ink-faint);font-size:10px;margin-top:3px;}
  .catwoe-text{font-size:14.5px;line-height:1.6;color:var(--ink);}

  /* SOMBREROS */
  .hats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:600px){.hats-grid{grid-template-columns:1fr 1fr;}}
  .hat-card{border:1.5px solid var(--ink);background:var(--paper-2);}
  .hat-top{height:8px;}
  .hat-body{padding:16px;}
  .hat-body h4{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
  .hat-body p{font-size:13.5px;line-height:1.55;color:var(--ink);}

  /* PARETO */
  .pareto-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .pareto-label{width:230px;flex-shrink:0;font-size:13.5px;color:var(--ink);}
  .pareto-bar-track{flex:1;height:20px;background:var(--paper-2);border:1px solid var(--line);position:relative;}
  .pareto-bar-fill{height:100%;background:var(--accent);}
  .pareto-bar-fill.vital{background:var(--gold);}
  .pareto-pct{width:44px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .pareto-note{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--ink-soft);}

  /* ISHIKAWA */
  .fishbone-effect{
    background:var(--ink);color:var(--accent-ink);padding:14px 18px;margin-bottom:22px;
    font-family:'Fraunces',serif;font-size:16px;
  }
  .bone-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.bone-grid{grid-template-columns:1fr;}}
  .bone-card{border-left:3px solid var(--accent);background:var(--paper-2);padding:14px 16px;}
  .bone-card h4{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .bone-card p{font-size:13.5px;line-height:1.55;color:var(--ink);}

  .detail-footer{margin-top:26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}

  /* ---------- AUTHOR ---------- */
  .author-panel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow);padding:36px;}
  .author-top{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;}
  .author-photo{
    width:110px;height:130px;background:var(--ink);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;
    font-size:30px;flex-shrink:0;border:1.5px solid var(--ink);
  }
  .author-info h2{font-size:24px;}
  .author-info .role{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:.05em;margin-top:6px;}
  .author-info .meta{margin-top:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.9;}
  .author-info .meta b{color:var(--ink);font-weight:600;}
  .gallery-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);margin:32px 0 14px;border-top:1px solid var(--line);padding-top:22px;
  }
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;}
  .gallery .tile{
    aspect-ratio:1/1;background:var(--paper-2);border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:center;
  }
  .author-edit-note{margin-top:26px;font-size:12px;color:var(--ink-faint);line-height:1.6;}

  ::selection{background:var(--gold);color:var(--ink);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ======================= DATA ======================= */

const QUESTIONS = [
  {id:1, cat:'general', tag:'Apertura del caso', text:'Describe la problemática que vas a investigar: ¿qué está pasando y en qué contexto ocurre?'},
  {id:2, cat:'foda', tag:'FODA · Interno positivo', text:'¿Qué fortalezas o recursos internos existen para enfrentar esta situación? ¿Qué oportunidades del entorno podrían aprovecharse?'},
  {id:3, cat:'foda', tag:'FODA · Interno negativo', text:'¿Qué debilidades internas y qué amenazas externas rodean al problema?'},
  {id:4, cat:'catwoe', tag:'CATWOE · Personas', text:'¿Quiénes son los clientes o beneficiarios afectados por el problema, y qué actores participan directamente en la situación?'},
  {id:5, cat:'catwoe', tag:'CATWOE · Sentido', text:'¿Cuál es la transformación deseada (de qué situación actual a cuál situación futura), y qué visión o creencia justifica que valga la pena resolverlo?'},
  {id:6, cat:'catwoe', tag:'CATWOE · Contexto', text:'¿Quién tiene la autoridad para decidir sobre este problema, y qué restricciones del entorno (normas, recursos, tiempo) lo limitan?'},
  {id:7, cat:'sombreros', tag:'6 Sombreros · Datos y emoción', text:'¿Qué datos objetivos tienes sobre el problema? ¿Qué sienten o perciben las personas involucradas al respecto?'},
  {id:8, cat:'sombreros', tag:'6 Sombreros · Riesgo y valor', text:'¿Qué riesgos o aspectos negativos identificas? ¿Qué beneficios traería resolver esta problemática?'},
  {id:9, cat:'sombreros', tag:'6 Sombreros · Ideas y proceso', text:'¿Qué ideas creativas se te ocurren para abordarlo? ¿Cómo organizarías el proceso para resolverlo paso a paso?'},
  {id:10, cat:'pareto', tag:'Pareto · Causas', text:'Enumera las causas o factores específicos que contribuyen a esta problemática (idealmente 4 a 8).'},
  {id:11, cat:'pareto', tag:'Pareto · Prioridad', text:'De esas causas, ¿cuáles crees que generan el mayor impacto o son responsables de la mayor parte del problema?'},
  {id:12, cat:'pareto', tag:'Pareto · Consecuencia', text:'¿Qué pasaría si esas causas prioritarias no se atienden?'},
  {id:13, cat:'ishikawa', tag:'Ishikawa · Método y personas', text:'¿Qué causas relacionadas con métodos, procedimientos o con las personas involucradas (mano de obra) contribuyen al problema?'},
  {id:14, cat:'ishikawa', tag:'Ishikawa · Recursos', text:'¿Qué causas relacionadas con materiales, herramientas o máquinas/tecnología contribuyen al problema?'},
  {id:15, cat:'ishikawa', tag:'Ishikawa · Entorno', text:'¿Qué causas relacionadas con el medio ambiente/entorno o con la medición y el control contribuyen al problema?'},
];

const ANALYSES_META = [
  {key:'foda', tab:'01', mark:'FODA', title:'Análisis FODA', desc:'Fortalezas, Oportunidades, Debilidades y Amenazas de la situación.'},
  {key:'catwoe', tab:'02', mark:'CATW', title:'Análisis CATWOE', desc:'Clientes, Actores, Transformación, Visión de mundo, Dueños y Ambiente.'},
  {key:'sombreros', tab:'03', mark:'6H', title:'6 Sombreros para Pensar', desc:'La problemática vista desde seis perspectivas distintas.'},
  {key:'pareto', tab:'04', mark:'80/20', title:'Diagrama de Pareto', desc:'Prioriza las causas que generan el mayor impacto.'},
  {key:'ishikawa', tab:'05', mark:'ISK', title:'Diagrama de Ishikawa', desc:'Causa raíz del problema por categorías.'},
  {key:'autor', tab:'06', mark:'★', title:'Ficha del investigador', desc:'Quién elaboró este expediente.'},
];

const AUTHOR = {
  nombre:'Ximena Martínez Gudiño',
  carrera:'Ingeniería de Software',
  email:'ximenagud25@gmail.com'
};

const STORAGE_KEY = 'expediente-data';

/* ======================= STATE ======================= */

let state = {
  screen:'cover',        // cover | questions | loading | hub | detail | author
  caseTitle:'',
  qIndex:0,
  answers:{},             // {1:"...", 2:"...", ...}
  analyses:null,          // generated JSON or null
  activeAnalysis:null,
  error:null,
  loaded:false,
};

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){
      const d = JSON.parse(r.value);
      state.caseTitle = d.caseTitle || '';
      state.answers = d.answers || {};
      state.analyses = d.analyses || null;
      if(state.caseTitle){
        state.screen = state.analyses ? 'hub' : 'questions';
        state.qIndex = Object.keys(state.answers).length;
        if(state.qIndex >= QUESTIONS.length) state.qIndex = QUESTIONS.length - 1;
      }
    }
  }catch(e){ /* no saved data yet */ }
  state.loaded = true;
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      caseTitle:state.caseTitle, answers:state.answers, analyses:state.analyses
    }), false);
  }catch(e){ console.error('No se pudo guardar', e); }
}

/* ======================= AI CALL ======================= */

function qaBlock(cats){
  return QUESTIONS.filter(q => cats.includes(q.cat) || q.cat === 'general')
    .map(q => `(${q.tag}) ${q.text}\nRespuesta: ${state.answers[q.id] || '(sin respuesta)'}`).join('\n\n');
}

const ANALYSIS_PROMPTS = {
  foda: () => `Eres consultor(a) experto en análisis organizacional. Problemática: "${state.caseTitle}".
Respuestas de investigación relevantes:
${qaBlock(['foda'])}

Genera un análisis FODA a partir de ESTAS respuestas. Responde ÚNICAMENTE con este JSON, sin texto extra ni markdown, cada lista con 2 a 4 puntos breves (máx. 12 palabras cada uno):
{"fortalezas": ["..."], "oportunidades": ["..."], "debilidades": ["..."], "amenazas": ["..."]}`,

  catwoe: () => `Eres consultor(a) experto en análisis organizacional. Problemática: "${state.caseTitle}".
Respuestas de investigación relevantes:
${qaBlock(['catwoe'])}

Genera un análisis CATWOE a partir de ESTAS respuestas. Responde ÚNICAMENTE con este JSON, sin texto extra ni markdown, cada campo en 1 frase breve (máx. 20 palabras):
{"clientes": "...", "actores": "...", "transformacion": "...", "visionMundo": "...", "duenos": "...", "ambiente": "..."}`,

  sombreros: () => `Eres consultor(a) experto en pensamiento lateral (método de los 6 Sombreros de Edward de Bono). Problemática: "${state.caseTitle}".
Respuestas de investigación relevantes:
${qaBlock(['sombreros'])}

Genera el análisis de los 6 sombreros a partir de ESTAS respuestas. Responde ÚNICAMENTE con este JSON, sin texto extra ni markdown, cada campo en 1 frase breve (máx. 20 palabras):
{"blanco": "...", "rojo": "...", "negro": "...", "amarillo": "...", "verde": "...", "azul": "..."}`,

  pareto: () => `Eres consultor(a) experto en análisis de causas. Problemática: "${state.caseTitle}".
Respuestas de investigación relevantes:
${qaBlock(['pareto'])}

Genera un diagrama de Pareto a partir de ESTAS respuestas. Responde ÚNICAMENTE con este JSON, sin texto extra ni markdown:
{"causas": [{"causa":"texto breve, máx 8 palabras", "impacto": 40}], "conclusion": "1 frase breve sobre las causas vitales (regla 80/20)"}
Reglas: entre 3 y 6 causas, ordenadas de mayor a menor "impacto", los impactos son números enteros que suman aproximadamente 100.`,

  ishikawa: () => `Eres consultor(a) experto en análisis de causa raíz (diagrama de Ishikawa). Problemática: "${state.caseTitle}".
Respuestas de investigación relevantes:
${qaBlock(['ishikawa'])}

Genera un diagrama de Ishikawa a partir de ESTAS respuestas. Responde ÚNICAMENTE con este JSON, sin texto extra ni markdown, cada campo en 1 frase breve (máx. 18 palabras):
{"problemaCentral": "resumen breve del efecto/problema", "metodo": "...", "manoDeObra": "...", "material": "...", "maquina": "...", "medicion": "...", "medioAmbiente": "..."}`,
};

async function callClaude(prompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      messages:[{role:"user", content: prompt}]
    })
  });
  const data = await response.json();
  const text = (data.content || []).map(b=>b.text||"").join("\n");
  const clean = text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

async function generateAnalyses(){
  state.screen = 'loading';
  state.error = null;
  render();
  const keys = Object.keys(ANALYSIS_PROMPTS);
  try{
    const results = await Promise.all(
      keys.map(k => callClaude(ANALYSIS_PROMPTS[k]()).catch(err => { console.error(k, err); return null; }))
    );
    const analyses = {};
    let anySuccess = false;
    keys.forEach((k,i) => { if(results[i]){ analyses[k] = results[i]; anySuccess = true; } });

    if(!anySuccess){
      throw new Error('Todas las llamadas fallaron');
    }
    state.analyses = { ...(state.analyses||{}), ...analyses };
    state.screen = 'hub';
    if(keys.some((k,i)=>!results[i])){
      state.error = 'Algunos análisis no se pudieron generar. Usa "Regenerar análisis" para reintentarlo.';
    }
    await persist();
  }catch(e){
    console.error(e);
    state.error = 'No se pudo generar el análisis. Revisa tu conexión e inténtalo de nuevo.';
    state.screen = 'questions';
    state.qIndex = QUESTIONS.length - 1;
  }
  render();
}

/* ======================= HELPERS ======================= */

function esc(s){
  if(s === undefined || s === null) return '';
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function catLabel(cat){
  return ({general:'General', foda:'FODA', catwoe:'CATWOE', sombreros:'6 Sombreros', pareto:'Pareto', ishikawa:'Ishikawa'})[cat] || cat;
}

/* ======================= RENDER ======================= */

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = ''; return; }

  let inner = '';
  if(state.screen === 'cover') inner = renderCover();
  else if(state.screen === 'questions') inner = renderQuestions();
  else if(state.screen === 'loading') inner = renderLoading();
  else if(state.screen === 'hub') inner = renderHub();
  else if(state.screen === 'detail') inner = renderDetail();
  else if(state.screen === 'author') inner = renderAuthor();

  app.innerHTML = `
    <div class="masthead">
      <div class="brand">Expediente de <b>Análisis</b></div>
      <div class="case-no">${state.caseTitle ? 'CASO — ' + esc(state.caseTitle).toUpperCase() : 'SIN ABRIR'}</div>
    </div>
    ${inner}
  `;
  attachHandlers();
}

function renderCover(){
  return `
    <div class="cover-hero">
      <span class="eyebrow">Proyecto final</span>
      <h1>Abre un expediente para tu problemática</h1>
      <p class="lede">Responde 15 preguntas cortas sobre una situación real o hipotética. Con tus respuestas, este expediente genera cinco análisis estratégicos completos: FODA, CATWOE, 6 Sombreros para Pensar, Pareto e Ishikawa.</p>
      <div class="field">
        <label for="caseTitleInput">Título de la problemática</label>
        <input id="caseTitleInput" type="text" placeholder="Ej. Rotación de personal en el área de soporte" value="${esc(state.caseTitle)}"/>
      </div>
      <div class="cover-steps">
        <div><b>15</b>preguntas guiadas, con avance y retroceso</div>
        <div><b>5</b>análisis generados a partir de tus respuestas</div>
        <div><b>1</b>expediente que puedes reabrir cuando quieras</div>
      </div>
      <div class="cover-actions">
        <button class="btn primary" id="startBtn">Abrir expediente →</button>
        <span class="hint">Tu avance se guarda automáticamente.</span>
      </div>
    </div>
  `;
}

function renderQuestions(){
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round(((state.qIndex) / total) * 100);
  const isLast = state.qIndex === total - 1;
  const val = state.answers[q.id] || '';
  return `
    <div class="folio-bar">
      <div class="folio-tag">Folio ${String(state.qIndex+1).padStart(2,'0')} / ${total}</div>
      <div class="folio-tag">${catLabel(q.cat)}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="height:26px"></div>
    <div class="question-card">
      <span class="cat-pill">${esc(q.tag)}</span>
      <h2>${esc(q.text)}</h2>
      <textarea class="qbox" id="answerBox" placeholder="Escribe tu respuesta aquí...">${esc(val)}</textarea>
      <div class="qnav">
        <button class="btn ghost" id="backBtn" ${state.qIndex===0 ? 'disabled':''}>← Atrás</button>
        <div class="right">
          <span class="hint" id="saveHint"></span>
          <button class="btn primary" id="nextBtn">${isLast ? 'Generar análisis →' : 'Siguiente →'}</button>
        </div>
      </div>
    </div>
    ${state.error ? `<div class="error-box">${esc(state.error)}</div>` : ''}
  `;
}

function renderLoading(){
  return `
    <div class="loading-box">
      <div class="stamp-spin"></div>
      <p>PROCESANDO EXPEDIENTE — CRUZANDO RESPUESTAS CON CADA MARCO DE ANÁLISIS…</p>
    </div>
  `;
}

function renderHub(){
  const cards = ANALYSES_META.map(m => {
    if(m.key === 'autor'){
      return `
        <div class="folder author" data-key="autor" data-tab="Ficha ${m.tab}">
          <div class="fmark">${m.mark}</div>
          <div>
            <h3>${m.title}</h3>
            <p>${m.desc}</p>
          </div>
          <div class="status ready"><span class="dot"></span>Disponible</div>
        </div>
      `;
    }
    const ready = !!(state.analyses && state.analyses[m.key]);
    return `
      <div class="folder" data-key="${m.key}" data-tab="Folio ${m.tab}">
        <div class="fmark">${m.mark}</div>
        <div>
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
        </div>
        <div class="status ${ready?'ready':''}"><span class="dot"></span>${ready ? 'Analizado' : 'Pendiente'}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="hub-head">
      <span class="eyebrow">Expediente abierto</span>
      <h1>${esc(state.caseTitle)}</h1>
      <p>Elige una carpeta para ver el análisis correspondiente, construido a partir de tus 15 respuestas.</p>
    </div>
    <div class="folder-grid">${cards}</div>
    <div class="hub-footer">
      <button class="btn ghost small" id="editAnswersBtn">✎ Editar respuestas</button>
      <button class="btn ghost small" id="regenerateBtn">↻ Regenerar análisis</button>
    </div>
    ${state.error ? `<div class="error-box" style="margin-top:18px;">${esc(state.error)}</div>` : ''}
  `;
}

function renderDetail(){
  const key = state.activeAnalysis;
  const meta = ANALYSES_META.find(m=>m.key===key);
  const a = state.analyses ? state.analyses[key] : null;
  let body = '<p>Sin datos disponibles.</p>';

  if(a && key==='foda'){
    const cell = (cls,label,arr) => `
      <div class="foda-cell ${cls}"><h4>${label}</h4>
        <ul>${(arr||[]).map(i=>`<li>${esc(i)}</li>`).join('') || '<li>—</li>'}</ul>
      </div>`;
    body = `<div class="foda-grid">
      ${cell('f','Fortalezas', a.fortalezas)}
      ${cell('o','Oportunidades', a.oportunidades)}
      ${cell('d','Debilidades', a.debilidades)}
      ${cell('a','Amenazas', a.amenazas)}
    </div>`;
  }

  if(a && key==='catwoe'){
    const rows = [
      ['Clientes','A quién afecta o beneficia',a.clientes],
      ['Actores','Quién participa en el proceso',a.actores],
      ['Transformación','De qué situación a cuál',a.transformacion],
      ['Visión de mundo','Por qué vale la pena resolverlo',a.visionMundo],
      ['Dueños','Quién decide',a.duenos],
      ['Ambiente','Restricciones del entorno',a.ambiente],
    ];
    body = rows.map(r=>`
      <div class="catwoe-row">
        <div class="catwoe-label">${r[0]}<small>${r[1]}</small></div>
        <div class="catwoe-text">${esc(r[2])}</div>
      </div>`).join('');
  }

  if(a && key==='sombreros'){
    const hats = [
      ['blanco','Blanco — Datos', 'var(--white-hat)'],
      ['rojo','Rojo — Emoción', 'var(--red-hat)'],
      ['negro','Negro — Riesgos', 'var(--black-hat)'],
      ['amarillo','Amarillo — Beneficios', 'var(--yellow-hat)'],
      ['verde','Verde — Creatividad', 'var(--green-hat)'],
      ['azul','Azul — Proceso', 'var(--blue-hat)'],
    ];
    body = `<div class="hats-grid">${hats.map(h=>`
      <div class="hat-card">
        <div class="hat-top" style="background:${h[2]}"></div>
        <div class="hat-body"><h4>${h[1]}</h4><p>${esc(a[h[0]])}</p></div>
      </div>`).join('')}</div>`;
  }

  if(a && key==='pareto'){
    const causas = (a.causas||[]).slice().sort((x,y)=> (y.impacto||0)-(x.impacto||0));
    let cum = 0;
    const rows = causas.map(c=>{
      cum += (c.impacto||0);
      const vital = cum <= 82;
      return `<div class="pareto-row">
        <div class="pareto-label">${esc(c.causa)}</div>
        <div class="pareto-bar-track"><div class="pareto-bar-fill ${vital?'vital':''}" style="width:${Math.min(c.impacto,100)}%"></div></div>
        <div class="pareto-pct">${c.impacto}%</div>
      </div>`;
    }).join('');
    body = `${rows}<div class="pareto-note">${esc(a.conclusion)}</div>`;
  }

  if(a && key==='ishikawa'){
    const bones = [
      ['Método', a.metodo], ['Mano de obra', a.manoDeObra],
      ['Material', a.material], ['Máquina', a.maquina],
      ['Medición', a.medicion], ['Medio ambiente', a.medioAmbiente],
    ];
    body = `
      <div class="fishbone-effect">Efecto: ${esc(a.problemaCentral)}</div>
      <div class="bone-grid">${bones.map(b=>`
        <div class="bone-card"><h4>${b[0]}</h4><p>${esc(b[1])}</p></div>
      `).join('')}</div>
    `;
  }

  return `
    <div class="detail-head">
      <div class="detail-title">
        <span class="eyebrow">Folio ${meta.tab}</span>
        <h1>${meta.title}</h1>
      </div>
      <div class="stamp">Analizado</div>
    </div>
    <div class="detail-panel">${body}</div>
    <div class="detail-footer">
      <button class="btn ghost" id="backHubBtn">← Volver al expediente</button>
    </div>
  `;
}

function renderAuthor(){
  const initials = AUTHOR.nombre.split(' ').map(w=>w[0]).slice(0,2).join('');
  const tiles = Array.from({length:9}).map((_,i)=>`<div class="tile">FOTO ${i+1}</div>`).join('');
  return `
    <div class="detail-head">
      <div class="detail-title">
        <span class="eyebrow">Folio 06</span>
        <h1>Ficha del investigador</h1>
      </div>
      <div class="stamp">Verificado</div>
    </div>
    <div class="author-panel">
      <div class="author-top">
        <div class="author-photo">${esc(initials)}</div>
        <div class="author-info">
          <h2>${esc(AUTHOR.nombre)}</h2>
          <div class="role">${esc(AUTHOR.carrera)}</div>
          <div class="meta">
            <div><b>Correo:</b> ${esc(AUTHOR.email)}</div>
            <div><b>Rol en el expediente:</b> autor(a) y analista</div>
          </div>
        </div>
      </div>
      <div class="gallery-label">Registro fotográfico</div>
      <div class="gallery">${tiles}</div>
      <p class="author-edit-note">Estos marcadores de foto son solo referencia visual — esta parte del expediente no depende de las 15 preguntas y puedes editarla por separado (reemplaza los recuadros "FOTO" por tus imágenes cuando quieras).</p>
    </div>
    <div class="detail-footer">
      <button class="btn ghost" id="backHubBtn">← Volver al expediente</button>
    </div>
  `;
}

/* ======================= HANDLERS ======================= */

function attachHandlers(){
  const $ = sel => document.querySelector(sel);

  if(state.screen === 'cover'){
    const input = $('#caseTitleInput');
    $('#startBtn').onclick = () => {
      const val = input.value.trim();
      if(!val){ input.focus(); input.style.borderColor = 'var(--brick)'; return; }
      state.caseTitle = val;
      state.screen = 'questions';
      state.qIndex = 0;
      persist();
      render();
    };
    input.onkeydown = (e) => { if(e.key === 'Enter') $('#startBtn').click(); };
  }

  if(state.screen === 'questions'){
    const box = $('#answerBox');
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);

    const saveCurrent = () => {
      const q = QUESTIONS[state.qIndex];
      state.answers[q.id] = box.value;
    };

    $('#backBtn').onclick = () => {
      saveCurrent();
      state.qIndex = Math.max(0, state.qIndex - 1);
      persist();
      render();
    };

    $('#nextBtn').onclick = () => {
      saveCurrent();
      persist();
      const isLast = state.qIndex === QUESTIONS.length - 1;
      if(isLast){
        generateAnalyses();
      } else {
        state.qIndex += 1;
        render();
      }
    };
  }

  if(state.screen === 'hub'){
    document.querySelectorAll('.folder').forEach(el=>{
      el.onclick = () => {
        const key = el.getAttribute('data-key');
        if(key === 'autor'){ state.screen = 'author'; }
        else { state.activeAnalysis = key; state.screen = 'detail'; }
        render();
      };
    });
    $('#editAnswersBtn').onclick = () => {
      state.qIndex = 0;
      state.screen = 'questions';
      render();
    };
    $('#regenerateBtn').onclick = () => generateAnalyses();
  }

  if(state.screen === 'detail' || state.screen === 'author'){
    const backBtn = $('#backHubBtn');
    if(backBtn) backBtn.onclick = () => { state.screen = 'hub'; render(); };
  }
}

loadState();
</script>
