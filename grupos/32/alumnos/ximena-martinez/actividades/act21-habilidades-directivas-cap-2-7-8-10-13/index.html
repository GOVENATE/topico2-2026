@media (prefers-color-scheme:dark){
  :root{--bg:#1f0b1e;--card:#2e1429;--soft:#271024;--text:#fdebf2;--muted:#d3b3c8;--line:#4a2742;

  --g-bg:#5a4310;--g-mid:#f2cf6a;--g-text:#fdf3d6}
}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
h1{font-size:24px;font-weight:600;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  --cbg:var(--r-bg);--cmid:var(--r-mid);--ctext:var(--r-text)}
.card.l{--cbg:var(--l-bg);--cmid:var(--l-mid);--ctext:var(--l-text)}
.card.d{--cbg:var(--d-bg);--cmid:var(--d-mid);--ctext:var(--d-text)}
.card.m{--cbg:var(--m-bg);--cmid:var(--m-mid);--ctext:var(--m-text)}
.card.g{--cbg:var(--g-bg);--cmid:var(--g-mid);--ctext:var(--g-text)}
.q{font-size:24px;font-weight:700;text-anchor:middle;fill:var(--ctext);font-family:system-ui,sans-serif}
.head{border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--cbg);color:var(--ctext)}
.head small{display:block;font-size:12px}
.head strong{font-size:18px;font-weight:600}
svg.main{width:100%;height:auto;display:block}
.pill{cursor:pointer;outline:none}
.pill rect{fill:var(--card);stroke:var(--line);stroke-width:1}
.pill text.lb{font-size:13px;font-family:system-ui,sans-serif;fill:var(--text)}
.pill circle{fill:var(--cbg);stroke:none}
.pill text.nm{font-size:12px;font-weight:600;font-family:system-ui,sans-serif;text-anchor:middle;fill:var(--ctext)}
.pill:hover rect,.pill:focus rect{stroke:var(--muted)}
.pill.on rect{fill:var(--cbg);stroke:var(--cmid);stroke-width:1.5}
.conn{stroke:var(--line);stroke-width:1.5}
.conn.on{stroke:var(--cmid);stroke-width:2.5}
.back{fill:var(--soft)}
.a{fill:var(--cbg);stroke:var(--cmid);stroke-width:2;stroke-linejoin:round}
.b{fill:var(--cmid);stroke:none}
.ln{fill:none;stroke:var(--cmid);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.det{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px;min-height:110px;background:var(--soft);margin-top:8px}
.det .ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--cbg);color:var(--cmid);display:flex;align-items:center;justify-content:center}
.det .ic svg{width:40px;height:40px}
.det .tx{min-width:0}
.det b{display:block;font-weight:600;margin-bottom:2px;color:var(--ctext)}
.hint{color:var(--muted)}
</style>
</head>

var data={
c2:{cap:'Capítulo 2',tit:'La alta dirección y sus habilidades',pts:[
['Dirigir','brujula','Es coordinar y guiar el esfuerzo de las personas para alcanzar las metas de la organización. El directivo no hace todo él mismo: logra que otros lo lleven a cabo.'],
['Proceso','pasos','La dirección es parte del proceso administrativo. Tiene una fase estática (prever, planear, organizar) y una dinámica (integrar, dirigir, controlar), que es donde entran las habilidades directivas.'],
['Directivo','estrella','Un buen directivo comunica bien, es flexible, positivo, responsable, respetuoso, creativo y honesto, y piensa en “nosotros” más que en “yo”.'],
['Admin vs líder','balanza','El administrador administra, mantiene y controla, y se enfoca en sistemas. El líder innova, desarrolla y da confianza, y se enfoca en la gente. Lo ideal es tener las dos cosas.'],
['Misión y visión','diana','La misión es la razón de ser de la empresa y la visión es hacia dónde va. El directivo primero define las suyas y después las de la organización.'],
['Pilares','pilares','Los pilares de la dirección son comunicación, delegación, venta, discurso, participación y compromiso. Los del liderazgo son poder, política, autoridad, maquiavelismo e inteligencia emocional.']]},
c7:{cap:'Capítulo 7',tit:'Toma de decisiones',pts:[
['Qué es decidir','tijeras','Es elegir entre varias alternativas. Viene del latín de-cidere, que significa cortar o dejar: se toma una opción y se dejan las otras.'],
['Método','matraz','Método científico: observación, definir el problema, hipótesis, experimentación, comprobación, generalización, teoría y ley. En cada etapa se toman decisiones.'],
['Pasos','pasos','1) definir el problema, 2) decidir el resultado y los criterios, 3) plantear alternativas, 4) elegir la mejor con pros y contras, 5) hacer el plan de acción, 6) ponerlo en práctica.'],
['Tipos','etiqueta','Programadas (de rutina) y no programadas (situaciones nuevas). También pueden ser individuales o grupales, y de certidumbre o incertidumbre.'],
['Cuantitativos','calculadora','Las matemáticas dan objetividad. Por ejemplo, productividad = unidades producidas ÷ insumos. En el caso del banco, la demanda indicó que se necesitan 5 cajas.'],
['Barreras','muro','No conocer el tema, no seguir el proceso, decidir de forma irracional, los prejuicios (ilusión de control, centralismo), la falta de objetividad y la presión de tiempo.']]},
c8:{cap:'Capítulo 8',tit:'Trabajo en equipo y manejo de conflictos',pts:[
['Grupo o equipo','personas','En un grupo cada quien aporta por su lado. En un equipo todos participan, se comprometen con el resultado y comparten los logros. Funciona mejor con no más de cinco personas.'],
['Modelos','engranes','Hay cuatro modelos de comportamiento: autocrático (obedecer), de custodia (prestaciones), de apoyo (liderazgo) y colegiado (compañerismo). Los dos últimos son los que mejor funcionan hoy.'],
['Beneficios','estrella','A la empresa le da más productividad y calidad. Al grupo le da menos conflictos y más compromiso. Al trabajador le da más autoestima y satisfacción.'],
['Conflictos','rayo','Pueden ser intrapersonales (con uno mismo), interpersonales (entre dos o más personas) y personales/funcionales (con el puesto que se ocupa).'],
['Fuentes','lupa','Los conflictos nacen de tres cosas: por qué hacemos lo que hacemos (valores), cómo lo hacemos (estilo) y qué sabemos hacer (conocimientos).'],
['Resolverlos','camino','Son 6 etapas: aceptar que el conflicto existe, localizar el conflicto real, escuchar todos los puntos de vista, buscar soluciones, llegar a acuerdos y dar seguimiento.']]},
c10:{cap:'Capítulo 10',tit:'Negociación como habilidad',pts:[
['Qué es','balanza','Es la forma más racional de resolver problemas entre las partes, buscando una solución que les sirva a todos. Negociamos siempre: hijo con papá, alumno con maestro, jefe con empleado.'],
['Fases','pasos','La negociación cara a cara tiene fases: preparación, discusión, señales, propuesta, intercambio, cierre y acuerdo. En todas hay que ser estratega.'],
['Ganar-ganar','check','Es el nuevo paradigma: que las dos partes salgan beneficiadas. Si uno gana y el otro pierde, después se invierten los papeles y al final los dos pierden.'],
['Comunicación','chat','Es la habilidad principal del negociador: saber escuchar, transmitir el mensaje y leer las señales verbales, físicas y de actitud. La tecnología solo es un apoyo.'],
['Variables','reloj','Influyen el marco (lugar, costumbres, idioma), las personas, el tiempo, la confianza, el espacio, el perfil de los negociadores y el protocolo.'],
['Personalidad','caras','Toda persona tiene tres estados del yo: padre, adulto y niño. Según cuál predomina, el estilo puede ser crítico, paternal, calculador, complaciente, conflictivo o imaginativo.']]},
c13:{cap:'Capítulo 13',tit:'Habilidades del pensamiento',pts:[
['Qué son','foco','Son la capacidad de usar lo que sabemos de forma creativa. Se desarrollan informándose, formándose y entrenando, hasta que se vuelven hábito.'],
['UNESCO','libro','La UNESCO propone cuatro aprendizajes básicos: aprender a conocer, aprender a hacer, aprender a ser y aprender a vivir juntos.'],
['Crítico','lupa','El pensamiento crítico es reflexionar, analizar y evaluar la información. Tiene cuatro áreas: razonamiento, solución de problemas, toma de decisiones y aprender a pensar.'],
['6 sombreros','sombrero','Técnica de De Bono. Blanco: datos. Rojo: sentimientos. Negro: crítica. Amarillo: lo positivo. Verde: ideas nuevas. Azul: control del proceso.'],
['Inteligencias','cerebro','Gardner dice que no hay una sola inteligencia: hay verbal, lógica, numérica, espacial, musical, corporal, interpersonal e intrapersonal.'],
['Lateral','espiral','El pensamiento lateral busca soluciones distintas e imaginativas, como en los acertijos, donde la respuesta casi nunca es la que esperas. Usa la perspicacia y el ingenio.']]}};
var cy=[40,135,230];
Object.keys(data).forEach(function(k){
  var d=data[k],el=document.getElementById(k),lines='',pills='';
  d.pts.forEach(function(p,i){
    var left=i<3,x=left?0:280,y=cy[i%3],ex=left?140:280;
    lines+='<line class="conn" id="'+k+'l'+i+'" x1="'+ex+'" y1="'+y+'" x2="210" y2="135"/>';
    pills+='<g class="pill" tabindex="0" role="button" data-i="'+i+'" aria-label="'+p[0]+'"><rect x="'+x+'" y="'+(y-20)+'" width="140" height="40" rx="12"/><circle cx="'+(x+20)+'" cy="'+y+'" r="11"/><text class="nm" x="'+(x+20)+'" y="'+(y+4)+'">'+(i+1)+'</text><text class="lb" x="'+(x+38)+'" y="'+(y+5)+'">'+p[0]+'</text></g>';
  });
  el.innerHTML='<div class="head"><small>'+d.cap+'</small><strong>'+d.tit+'</strong></div>'+
    '<svg class="main" viewBox="0 0 420 270" role="group" aria-label="'+d.tit+'">'+lines+'<circle class="back" cx="210" cy="135" r="78"/>'+art[k]+pills+'</svg>'+
    '<div class="det"><div class="tx"><span class="hint">Toca un punto para ver la información.</span></div></div>';
  function pick(g){
    var i=+g.getAttribute('data-i'),p=d.pts[i];
    el.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on')});
    el.querySelectorAll('.conn').forEach(function(x){x.classList.remove('on')});
    g.classList.add('on');
    document.getElementById(k+'l'+i).classList.add('on');
    el.querySelector('.det').innerHTML='<div class="ic"><svg viewBox="0 0 48 48" aria-hidden="true">'+ico[p[1]]+'</svg></div><div class="tx"><b>'+p[0]+'</b>'+p[2]+'</div>';
  }
  el.querySelectorAll('.pill').forEach(function(g){
    g.addEventListener('click',function(){pick(g)});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g)}});
  });
});
</script>

</html>
