<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collages · Habilidades Directivas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Caveat:wght@600;700&family=Archivo+Black&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600&family=Bebas+Neue&family=Special+Elite&family=Jost:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:70px}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#111;color:#222}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#000d;backdrop-filter:blur(8px)}
#nav a{padding:8px 14px;border-radius:99px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:2px solid #fff4;transition:.2s}
#nav a:hover{transform:translateY(-2px)}
#nav a.on{background:#fff;color:#000}
section{min-height:100vh;padding:28px 16px 60px;overflow:hidden}
.wrap{max-width:1100px;margin:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;justify-content:center}
.go a{padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
button{font:inherit;cursor:pointer}

/* ===== CAP 2 · Ejecutivo editorial ===== */
#cap2{background:#0e1a2b;color:#f3ead7;font-family:Georgia,serif}
#cap2 h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(38px,8vw,84px);line-height:.95;margin:0;color:#d9b45b}
#cap2 .k{letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:#d9b45b99}
#cap2 .t{background:#16263d;border:1px solid #d9b45b55;padding:20px;border-radius:2px;position:relative}
#cap2 .t h3{font-family:'Playfair Display',serif;margin:0 0 10px;color:#d9b45b}
#cap2 .w2{grid-column:span 2}
#cap2 .q{background:#d9b45b;color:#0e1a2b;font-size:20px;font-style:italic}
#cap2 .q b{display:block;margin-top:10px;font-size:13px;font-style:normal}
#cap2 .sw{background:#d9b45b;color:#0e1a2b;border:0;padding:6px 14px;border-radius:99px;font-weight:700;margin-bottom:12px}
#cap2 .pair{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted #d9b45b44}
#cap2 .flip{perspective:700px;height:150px;cursor:pointer}
#cap2 .fi{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}
#cap2 .flip.f .fi{transform:rotateY(180deg)}
#cap2 .fi>div{position:absolute;inset:0;backface-visibility:hidden;padding:18px;display:flex;flex-direction:column;justify-content:center;border:1px solid #d9b45b88}
#cap2 .fi>div+div{transform:rotateY(180deg);background:#d9b45b;color:#0e1a2b}
#cap2 .chips{display:flex;flex-wrap:wrap;gap:7px}
#cap2 .chips span{border:1px solid #d9b45b88;padding:5px 11px;border-radius:99px;font-size:13px;transition:.2s}
#cap2 .chips span:hover{background:#d9b45b;color:#0e1a2b;transform:rotate(-3deg) scale(1.1)}
#cap2 .steps{display:flex;gap:6px;flex-wrap:wrap}
#cap2 .steps div{flex:1;min-width:80px;text-align:center;padding:12px 4px;background:#0e1a2b;font-size:13px}
#cap2 .steps .d{background:#d9b45b;color:#0e1a2b;font-weight:700}
#cap2 .go a{background:#d9b45b;color:#0e1a2b}

/* ===== CAP 8 · Corcho y notas ===== */
#cap8{background:#c19a6b radial-gradient(#0002 1.5px,transparent 2px) 0 0/18px 18px;font-family:Caveat,cursive;color:#2b2b2b}
#cap8 h1{font-size:clamp(40px,9vw,90px);margin:0;transform:rotate(-2deg);display:inline-block;background:#fff;padding:4px 22px;box-shadow:3px 5px 0 #0004}
#cap8 .board{position:relative;display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;justify-content:center}
#cap8 .n{width:240px;min-height:170px;padding:18px 16px;font-size:22px;line-height:1.1;box-shadow:4px 8px 14px #0005;cursor:grab;touch-action:none;transition:transform .2s;user-select:none;position:relative}
#cap8 .n:hover{transform:rotate(0) scale(1.05)!important;z-index:5}
#cap8 .n::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;border-radius:50%;background:#c0392b;box-shadow:0 3px 3px #0006}
#cap8 .n h3{margin:0 0 6px;font-size:28px}
#cap8 .n small{display:block;margin-top:8px;font-size:18px;opacity:.75}
#cap8 .n.big{width:340px}
#cap8 .go a{background:#fff;color:#2b2b2b;font-family:Inter,sans-serif}

/* ===== CAP 10 · Constructivista ===== */
#cap10{background:#f2e8d5;color:#111;font-family:'Archivo Black',Impact,sans-serif}
#cap10 .hd{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border:5px solid #111}
#cap10 .hd>div{padding:26px}
#cap10 h1{margin:0;font-size:clamp(40px,8vw,88px);line-height:.9;text-transform:uppercase}
#cap10 .red{background:#e63222;color:#f2e8d5}
#cap10 .bl{background:#111;color:#f2e8d5;font-family:Inter,sans-serif;font-size:14px}
#cap10 .tl{display:flex;gap:0;margin:26px 0 0;overflow-x:auto;border:5px solid #111}
#cap10 .tl button{flex:1;min-width:96px;padding:16px 6px;border:0;border-right:3px solid #111;background:#f2e8d5;font-family:inherit;font-size:13px;text-transform:uppercase}
#cap10 .tl button.on{background:#f6b800}
#cap10 #ph{background:#f6b800;border:5px solid #111;border-top:0;padding:20px;font-family:Inter,sans-serif;font-weight:600;font-size:17px;min-height:74px}
#cap10 .mid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
#cap10 .wl{display:flex;border:5px solid #111;min-height:170px;font-size:clamp(26px,5vw,48px)}
#cap10 .wl div{flex:1;display:flex;align-items:center;justify-content:center;transition:flex .4s;cursor:pointer;text-align:center;padding:8px}
#cap10 .wl div:hover{flex:2.2}
#cap10 .vars{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;font-family:Inter,sans-serif}
#cap10 .vars b{padding:8px 12px;background:#111;color:#f2e8d5;font-size:13px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);cursor:pointer;transition:.2s}
#cap10 .vars b.on{background:#e63222;transform:translateX(6px)}
#cap10 .go a{background:#111;color:#f6b800}
@media(max-width:700px){#cap10 .hd,#cap10 .mid{grid-template-columns:1fr}}

/* ===== CAP 13 · Pop neón / burbujas ===== */
#cap13{background:#120a2a;color:#fff;font-family:'Space Grotesk',sans-serif;position:relative}
#cap13::before,#cap13::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);z-index:0}
#cap13::before{width:420px;height:420px;background:#ff3d9a66;top:-80px;left:-100px}
#cap13::after{width:460px;height:460px;background:#00e5ff44;bottom:0;right:-120px}
#cap13 .wrap{position:relative;z-index:1}
#cap13 h1{font-size:clamp(38px,8vw,80px);margin:0;background:linear-gradient(90deg,#ff3d9a,#ffd23f,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#cap13 .hats{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:26px 0}
#cap13 .hat{width:104px;height:104px;border-radius:50%;border:0;font-weight:700;font-size:13px;color:#111;transition:.3s;box-shadow:0 0 0 0 #fff0}
#cap13 .hat:hover{transform:translateY(-8px) rotate(-6deg)}
#cap13 .hat.on{transform:scale(1.22);box-shadow:0 0 0 6px #fff6,0 0 40px currentColor}
#cap13 #hd{background:#ffffff14;border:1px solid #fff3;border-radius:22px;padding:20px;text-align:center;font-size:18px;min-height:72px}
#cap13 .bub{background:#ffffff12;border:1px solid #fff3;border-radius:28px 28px 28px 6px;padding:18px;transition:.3s;cursor:pointer}
#cap13 .bub:nth-child(even){border-radius:28px 28px 6px 28px}
#cap13 .bub:hover{background:#ffffff26;transform:scale(1.03) rotate(-1deg)}
#cap13 .bub h3{margin:0 0 6px;color:#ffd23f}
#cap13 .bub p{margin:0;font-size:14px;opacity:.85}
#cap13 .bub.x p{display:none}
#cap13 h2{margin:34px 0 12px;color:#00e5ff}
#cap13 .go a{background:#ff3d9a;color:#fff}

/* ===== PSY · La psicología del dinero (acotado a #psy) ===== */
#psy{--paper:#e9ddc0;--ink:#1b1b1b;--green:#2f6b3a;--red:#c0392b;--hl:#ffe14d;padding:0;background:var(--paper) repeating-linear-gradient(0deg,#0000 0 3px,#0000000a 3px 4px);color:var(--ink);font-family:'Special Elite','Courier New',monospace}
#psy .wrap{max-width:1050px;margin:auto;padding:24px 16px 70px}
#psy h1,#psy h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
#psy h1{font-size:clamp(56px,13vw,150px);line-height:.85;color:var(--green)}
#psy h2{font-size:clamp(34px,6vw,58px);display:inline-block;background:var(--ink);color:var(--paper);padding:2px 14px;transform:rotate(-1.5deg);margin:50px 0 18px}
#psy .tape{position:absolute;width:90px;height:26px;background:#f4e9a8cc;top:-12px;left:calc(50% - 45px);transform:rotate(-4deg);box-shadow:0 1px 3px #0003}
#psy .stamp{display:inline-block;border:4px solid var(--red);color:var(--red);padding:2px 12px;font-family:'Bebas Neue';font-size:30px;transform:rotate(-8deg);opacity:.85}
#psy .hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
#psy .brain{position:relative;aspect-ratio:1;max-width:340px;margin:auto;background:radial-gradient(circle at 35% 35%,#4f9a5c,#1e4d29);border-radius:46% 54% 48% 52%/52% 46% 54% 48%;box-shadow:6px 10px 0 #0003;overflow:hidden;cursor:pointer;transition:.5s}
#psy .brain span{position:absolute;font-family:'Bebas Neue';font-size:34px;color:#e9ddc0;opacity:.35;transition:.5s;white-space:nowrap}
#psy .brain:hover span,#psy .brain.x span{opacity:.95}
#psy .brain::after{content:"toca";position:absolute;bottom:14px;width:100%;text-align:center;color:#fff9;font-size:13px}
#psy .note{background:#fff8dc;padding:18px;box-shadow:4px 7px 12px #0003;position:relative}
#psy .pers{display:flex;gap:14px;overflow-x:auto;padding:16px 6px 26px;scroll-snap-type:x mandatory}
#psy .pol{flex:0 0 160px;background:#fff;padding:10px 10px 14px;box-shadow:3px 6px 10px #0004;border:0;text-align:left;font:inherit;scroll-snap-align:center;transition:.25s;position:relative}
#psy .pol:hover{transform:translateY(-6px) rotate(0)!important}
#psy .pol.on{outline:4px solid var(--green);transform:scale(1.06) rotate(0)!important}
#psy .pol i{display:block;height:100px;margin-bottom:8px;font-style:normal;font-size:54px;text-align:center;line-height:100px}
#psy .pol b{font-size:14px;display:block}
#psy .lens{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#fff8dc;padding:22px;box-shadow:5px 9px 0 #0003;position:relative;margin-top:8px}
#psy .lens h3{font-family:'Bebas Neue';font-size:34px;margin:0 0 6px;color:var(--green)}
#psy .lens p{margin:0 0 10px;line-height:1.45;font-size:15px}
#psy .gob{background:var(--ink);color:var(--paper);border:0;padding:12px 18px;font:inherit;font-size:15px;box-shadow:3px 3px 0 var(--red);margin-top:6px}
#psy .gob:hover{background:var(--green)}
#psy .hide{opacity:0;max-height:0;overflow:hidden;transition:.5s}
#psy .show{opacity:1;max-height:400px}
#psy .meter{position:relative;height:34px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--green),var(--hl),var(--red));margin:6px 0 4px}
#psy .meter u{position:absolute;top:-10px;bottom:-10px;width:8px;background:var(--ink);left:88%;transition:left 1.1s cubic-bezier(.3,1.6,.5,1)}
#psy .ml{display:flex;justify-content:space-between;font-size:12px}
#psy .bars{display:grid;gap:14px}
#psy .bar{height:50px;border:3px solid var(--ink);background:#fff8;position:relative;overflow:hidden}
#psy .bar div{height:100%;width:var(--w);background:var(--c);transition:width 1.6s ease;display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;white-space:nowrap}
#psy .bars.off .bar div{width:2px}
#psy .ptl{position:relative;display:flex;gap:10px;overflow-x:auto;padding:30px 4px 10px;border-top:5px dashed var(--ink)}
#psy .ptl button{flex:0 0 auto;border:0;background:var(--hl);font:inherit;padding:8px 12px;box-shadow:2px 4px 0 #0004;transition:.2s}
#psy .ptl button.on{background:var(--green);color:#fff;transform:translateY(-8px) rotate(-2deg)}
#psy #ptx{background:#fff;padding:18px;min-height:90px;margin-top:10px;box-shadow:4px 6px 0 #0003;line-height:1.45}
#psy .idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
#psy .ch{border:0;padding:14px 10px;min-height:96px;text-align:left;font:inherit;font-size:14px;background:#fff;box-shadow:2px 4px 0 #0004;clip-path:polygon(0 3%,5% 0,100% 2%,98% 100%,4% 97%);transition:.2s}
#psy .ch b{display:block;font-family:'Bebas Neue';font-size:36px;color:var(--green);line-height:1}
#psy .ch:hover{transform:rotate(-2deg) scale(1.05);background:var(--hl)}
#psy .ch.open{background:var(--green);color:#fff}#psy .ch.open b{color:var(--hl)}
#psy #pcm{margin-top:12px;font-family:Caveat,cursive;font-size:26px;min-height:36px}
#psy .go a{background:var(--ink);color:var(--paper)}
@media(max-width:720px){#psy .hero,#psy .lens{grid-template-columns:1fr}}

/* ===== DAL · Principios, Ray Dalio (acotado a #dal) ===== */
#dal{--coral:#dc3b5b;--ink:#231f20;--paper:#f6f1ea;--pink:#f6c3cd;padding:0;background:var(--paper);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.45;overflow:hidden}
#dal h1,#dal h2,#dal h3,#dal .dk,#dal button,#dal label{font-family:Jost,Futura,'Trebuchet MS',sans-serif}
#dal .dk{font-weight:700;letter-spacing:.28em;font-size:12px;text-transform:uppercase;color:var(--coral)}
#dal .dh{display:grid;grid-template-columns:1.1fr 1fr}
#dal .dh-a{position:relative;overflow:hidden;background:var(--coral);color:#fff;padding:clamp(24px,5vw,56px)}
#dal .dh-a::after{content:"";position:absolute;right:-70px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:var(--pink);opacity:.45}
#dal .dh-a .dk{color:var(--ink)}
#dal h1{margin:14px 0 12px;font-weight:700;letter-spacing:.14em;font-size:clamp(30px,5.2vw,62px);line-height:1}
#dal .dh-a p{margin:0;max-width:34ch;font-size:18px;position:relative;z-index:1}
#dal .dh-b{position:relative;background:var(--ink);color:#fff;padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:center}
#dal .dh-b::before{content:"";position:absolute;left:0;top:0;width:90px;height:45px;border-radius:0 0 90px 90px;background:var(--coral)}
#dal .dq{font-family:Jost,sans-serif;font-weight:700;font-size:clamp(19px,2.3vw,27px);line-height:1.3;margin:14px 0 0}
#dal .dr{grid-column:1/-1;background:var(--paper)}
#dal .dr canvas{display:block;width:100%;height:200px}
#dal .drc{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--ink);color:#fff;padding:14px clamp(16px,5vw,56px)}
#dal .drc label{font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
#dal .drc input{accent-color:var(--coral);flex:1 1 180px;max-width:360px}
#dal #dmsg{flex:1 1 240px;font-size:16px;opacity:.9}
#dal #dcount{font-family:Jost,sans-serif;font-weight:700;color:var(--pink);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#dal .dm{padding:clamp(40px,7vw,84px) 16px}
#dal .dm>.bx{max-width:1000px;margin:auto}
#dal .dark{background:var(--ink);color:#fff}
#dal h2{margin:8px 0 14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(24px,4vw,40px);line-height:1.1}
#dal p.lead{max-width:60ch;margin:0 0 26px}
#dal .btn{background:var(--ink);color:#fff;border:0;padding:11px 18px;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase;cursor:pointer;transition:.2s}
#dal .btn:hover:not(:disabled){background:var(--coral)}
#dal .btn:disabled{opacity:.35;cursor:not-allowed}
#dal .dark .btn{background:var(--coral)}
#dal .dark .btn:hover:not(:disabled){background:#fff;color:var(--ink)}
/* ciclo */
#dal .lp{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:28px;align-items:center}
#dal .lp svg{width:100%;height:auto}
#dal .nd{cursor:pointer;outline:none}
#dal .nd circle{fill:#fff;stroke:var(--ink);stroke-width:3;transition:.3s}
#dal .nd:hover circle,#dal .nd:focus circle{stroke:var(--coral)}
#dal .nd.on circle{fill:var(--coral);stroke:var(--coral)}
#dal .nd text{font:700 11px Jost,sans-serif;text-anchor:middle;pointer-events:none;fill:var(--ink)}
#dal .nd.on text{fill:#fff}
#dal .ar{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 6;animation:dd 1.2s linear infinite}
@keyframes dd{to{stroke-dashoffset:-22}}
#dal #dptr{transform-origin:210px 210px;transition:transform .9s cubic-bezier(.5,0,.2,1)}
#dal .lc1{font:700 11px Jost,sans-serif;letter-spacing:.25em;text-anchor:middle;fill:#8b8587}
#dal .lc2{font:700 40px Jost,sans-serif;text-anchor:middle;fill:var(--coral)}
#dal .lcard{background:#fff;border-left:8px solid var(--coral);padding:20px 22px;min-height:150px;box-shadow:6px 8px 0 #0001}
#dal .lcard b{font-family:Jost,sans-serif;font-size:21px;display:block;margin-bottom:6px;line-height:1.2}
/* río de scroll */
#dal .lr{position:relative;margin-top:24px;padding-top:6px}
#dal .lr svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#dal .ls{position:relative;z-index:1;width:calc(50% - 40px);margin:0 0 44px;background:#fff;padding:16px 20px 18px;border-top:6px solid var(--coral);box-shadow:6px 8px 0 #0001;opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s}
#dal .ls.r{margin-left:auto}
#dal .ls.vis{opacity:1;transform:none}
#dal .ls.ink{background:var(--ink);color:#fff;border-top-color:var(--pink)}
#dal .ls .y{font-family:Jost,sans-serif;font-weight:700;font-size:clamp(28px,4vw,40px);color:var(--coral);line-height:1;display:block;letter-spacing:.04em}
#dal .ls.ink .y{color:var(--pink)}
#dal .ls h3{margin:8px 0 6px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
#dal .ls p{margin:0 0 4px;font-size:17px}
#dal .ls .btn{margin-top:8px}
/* apuesta */
#dal .bet{display:grid;grid-template-columns:1fr 1.5fr;gap:28px;align-items:start}
#dal .bet svg{width:100%;height:auto;display:block;background:#ffffff0d}
#dal .bet input[type=range]{width:100%;accent-color:var(--coral);margin:12px 0}
#dal .gt{font:600 11px Jost,sans-serif;fill:#ffffff99}
#dal .dctl{display:flex;gap:10px;flex-wrap:wrap}
#dal #dres{margin-top:14px;min-height:80px;font-size:18px}
#dal #dres b{color:var(--pink);font-family:Jost,sans-serif;font-size:26px;display:block}
#dal .stat{font-family:Jost,sans-serif;font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--pink);min-height:22px;margin-top:10px}
#dal .small{font-size:15px;opacity:.7}
/* rueda */
#dal .wh{max-width:620px;margin:0 auto}
#dal .wh svg{width:100%;height:auto;display:block}
#dal .wh path{cursor:pointer;transition:transform .25s,filter .25s;transform-origin:320px 320px;outline:none}
#dal .wh path:hover,#dal .wh path:focus{transform:scale(1.025)}
#dal .wh path.on{transform:scale(1.045);filter:drop-shadow(0 5px 6px #0007)}
#dal .wn{font:700 13px Jost,sans-serif;pointer-events:none}
#dal .wa{font:700 13px Jost,sans-serif;letter-spacing:.25em;fill:#8b8587;text-anchor:middle}
#dal .wb{font:700 92px Jost,sans-serif;fill:var(--coral);text-anchor:middle}
#dal .wc{font:600 18px Jost,sans-serif;fill:var(--ink);text-anchor:middle}
#dal .din{background:var(--ink);color:#fff;max-width:620px;margin:22px auto 0;padding:20px 24px;border-left:10px solid var(--coral);min-height:150px}
#dal .din p{margin:6px 0 0}
#dal .din-t{font-family:Jost,sans-serif;font-weight:700;font-size:clamp(20px,3vw,27px);line-height:1.15;margin:8px 0}
#dal .din-t span{color:var(--coral);margin-right:6px}
#dal .dpb{position:relative;height:8px;background:#ffffff33;margin:16px 0 8px}

 function sel(gi,j){
  const g=GR[gi];
  sv.querySelectorAll("path").forEach(p=>p.classList.toggle("on",+p.dataset.g===gi&&(j==null?p.dataset.j===undefined:+p.dataset.j===j)));
  let h;
  if(j==null){
   $("#dwa").textContent="PARTE "+g.lab.toUpperCase();$("#dwb").textContent=g.lab;$("#dwc").textContent=g.ch.length+" capítulos";
   h=`<div class="dk" style="color:#f6c3cd">${g.nm}</div><div class="din-t">${g.sub||"Panorama de la parte"}</div><p>${g.ch.length} capítulos · desde la pág. ${g.ch[0][2]}</p>`;
  }else{
   const c=g.ch[j],n=j+1+g.off,pg=c[2];
   $("#dwa").textContent=g.nm.split(" · ")[0].toUpperCase();$("#dwb").textContent=n;$("#dwc").textContent="pág. "+pg;
   h=`<div class="dk" style="color:#f6c3cd">${g.nm}${g.sub?" · "+g.sub:""}</div><div class="din-t"><span>${n}</span>${c[0]}</div>${c[1]?`<p>${c[1]}</p>`:""}<div class="dpb"><i style="left:${pg/583*100}%"></i></div><small>pág. ${pg} de unas 583 · ${Math.round(pg/583*100)} % del libro</small>`;
   if(gi===0&&j===0)h+=`<p style="margin-top:12px">Este es el capítulo que recorre esta muestra.</p><button class="btn" data-to="dlr">Ver su historia ↑</button>`;
  }
  $("#dwi").innerHTML=h;
 }
 const hit=e=>{const p=e.target.closest&&e.target.closest("path");if(p)sel(+p.dataset.g,p.dataset.j===undefined?null:+p.dataset.j)};
 sv.addEventListener("click",hit);
 sv.addEventListener("pointerover",e=>{if(e.pointerType==="mouse")hit(e)});
 sv.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit(e)}});
 sel(0,0);
 }

 /* saltos internos */
 const jump=e=>{const b=e.target.closest("[data-to]");if(!b)return;const el=document.getElementById(b.dataset.to);if(el)el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})};
 $("#dal").addEventListener("click",jump);
};

function render(){
 if(window.__cleanup){try{window.__cleanup()}catch(e){}window.__cleanup=null}
 const k=(location.hash||"#cap2").slice(1);const id=P[k]?k:"cap2";
 $("#app").innerHTML=P[id]();P[id].init&&P[id].init();
 $("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===id?"on":""}">${n[1]}</a>`).join("");
 window.scrollTo(0,0);
}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
