<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memorama · Filosofía japonesa</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .layout { display: block; }
  @media (min-width: 760px) {
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
  }

  @keyframes reveal { from { transform: scale(.85) rotateY(80deg); opacity: .3; } to { transform: scale(1) rotateY(0); opacity: 1; } }
  .face-up { animation: reveal .35s ease; }

  @keyframes matchPulse { 0% { box-shadow: 0 0 0 0 rgba(46,125,79,.45); } 100% { box-shadow: 0 0 0 10px rgba(46,125,79,0); } }
  .just-matched { animation: matchPulse .7s ease-out; }

  @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .row-found { animation: popIn .4s ease; }

  @keyframes bannerIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
  .banner { animation: bannerIn .4s ease; }

  .card-btn { transition: transform .15s ease, box-shadow .15s ease; }
  .card-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ---------- Paleta ----------
const INK = "#2B2A28";
const PAPER = "#F3EFE6";
const CARD_BACK = "#3A3835";
const AKANE = "#B23A2F";
const GREEN = "#2E7D4F";
const MUTED = "#7A7364";
const HAIRLINE = "#DCD5C4";

const CONCEPTS = [
  { id: "ikigai", term: "Ikigai", meaning: "Razón de ser: lo que da sentido y motivación a la vida diaria.", color: "#B8862B" },
  { id: "wabisabi", term: "Wabi-sabi", meaning: "La belleza de lo imperfecto, transitorio e incompleto.", color: "#8B4A3B" },
  { id: "mononoaware", term: "Mono no aware", meaning: "La conmovedora conciencia de que todo es pasajero.", color: "#A24E6E" },
  { id: "bushido", term: "Bushido", meaning: "El código de honor, lealtad y disciplina del samurái.", color: "#3E5C76" },
  { id: "zen", term: "Zen", meaning: "Escuela budista centrada en la meditación como vía directa.", color: "#4C7A78" },
  { id: "kaizen", term: "Kaizen", meaning: "Mejora continua a través de pequeños cambios constantes.", color: "#6B7A3A" },
  { id: "ma", term: "Ma", meaning: "El espacio o la pausa significativa entre las cosas.", color: "#7A6E56" },
  { id: "mottainai", term: "Mottainai", meaning: "El lamento ante el desperdicio; gratitud por los recursos.", color: "#3E6B5C" },
];

// ---------- Iconos de línea, uno por concepto ----------
function ConceptIcon({ id, color, size = 26 }) {
  const common = { fill: "none", stroke: color, strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    ikigai: <>
      <circle cx="9" cy="9" r="6" {...common} />
      <circle cx="15" cy="9" r="6" {...common} />
      <circle cx="9" cy="15" r="6" {...common} />
      <circle cx="15" cy="15" r="6" {...common} />
    </>,
    wabisabi: <>
      <path d="M4 9 C4 15 8 19 12 19 C16 19 20 15 20 9" {...common} />
      <path d="M9 9 L11 12 L9 14 L13 17" {...common} />
      <circle cx="11" cy="12" r="0.9" fill={color} stroke="none" />
    </>,
    mononoaware: <>
      <path d="M12 3 C15.5 6.2 15.5 10 12 12.3 C8.5 10 8.5 6.2 12 3 Z" {...common} />
      <path d="M8 20 C10 16.5 12 14.5 12 12.3" strokeDasharray="2 2.4" {...common} />
    </>,
    bushido: <>
      <line x1="5" y1="19" x2="19" y2="5" {...common} />
      <line x1="7.4" y1="13.6" x2="10.4" y2="16.6" {...common} />
    </>,
    zen: <path d="M6 13 A6.3 6.3 0 1 1 17.3 16" {...common} />,
    kaizen: <>
      <path d="M4 19 H8 V15 H12 V11 H16 V7 H20" {...common} />
      <line x1="20" y1="7" x2="16.3" y2="7" {...common} />
      <line x1="20" y1="7" x2="20" y2="10.7" {...common} />
    </>,
    ma: <>
      <path d="M8.5 4 L5.5 4 L5.5 20 L8.5 20" {...common} />
      <path d="M15.5 4 L18.5 4 L18.5 20 L15.5 20" {...common} />
    </>,
    mottainai: <>
      <path d="M12 3 C16 9 18 12.3 18 15 A6 6 0 1 1 6 15 C6 12.3 8 9 12 3 Z" {...common} />
      <path d="M9.2 15.3 a3 3 0 0 0 3 2.8" {...common} />
    </>,
  };
  return (
    <svg viewBox="0 0 24 24" width={size} height={size}>
      {paths[id]}
    </svg>
  );
}

function LockIcon({ color = MUTED }) {
  return (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <rect x="5" y="10" width="14" height="10" rx="2" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3" />
    </svg>
  );
}
function CheckIcon({ color = GREEN }) {
  return (
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20 6L9 17l-5-5" />
    </svg>
  );
}
function RestartIcon() {
  return (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2">
      <path d="M1 4v6h6M23 20v-6h-6" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M3.51 15a9 9 0 1 0 .49-9.36L1 10" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
function ArrowIcon() {
  return (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </svg>
  );
}

function buildDeck() {
  const deck = [];
  CONCEPTS.forEach((c) => {
    deck.push({ key: c.id + "-a", conceptId: c.id, kind: "term", display: c.term });
    deck.push({ key: c.id + "-b", conceptId: c.id, kind: "term", display: c.term });
  });
  return deck.sort(() => Math.random() - 0.5);
}

function App() {
  const [view, setView] = useState("intro");
  const [deck, setDeck] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState([]);
  const [attempts, setAttempts] = useState(0);
  const [locked, setLocked] = useState(false);

  const startGame = () => {
    setDeck(buildDeck());
    setFlipped([]);
    setMatched([]);
    setAttempts(0);
    setLocked(false);
    setView("game");
  };

  const handleFlip = (idx) => {
    if (locked || flipped.includes(idx) || deck[idx].matched) return;
    const nextFlipped = [...flipped, idx];
    setFlipped(nextFlipped);

    if (nextFlipped.length === 2) {
      setLocked(true);
      const [a, b] = nextFlipped;
      const cardA = deck[a], cardB = deck[b];
      setAttempts((n) => n + 1);
      if (cardA.conceptId === cardB.conceptId) {
        setTimeout(() => {
          setDeck((d) => d.map((c, i) => (i === a || i === b ? { ...c, matched: true } : c)));
          setMatched((m) => [...m, cardA.conceptId]);
          setFlipped([]);
          setLocked(false);
        }, 500);
      } else {
        setTimeout(() => { setFlipped([]); setLocked(false); }, 900);
      }
    }
  };

  const allMatched = matched.length === CONCEPTS.length;

  return (
    <div style={{ background: PAPER, color: INK, minHeight: "100vh" }}>
      <div style={{ maxWidth: 900, margin: "0 auto", padding: "36px 20px" }}>
        {view === "intro" && <Intro onStart={startGame} />}
        {view === "game" && (
          <Game deck={deck} flipped={flipped} matched={matched} attempts={attempts}
            allMatched={allMatched} onFlip={handleFlip} onRestart={startGame}
            onContinue={() => setView("overview")} />
        )}
        {view === "overview" && <Overview onRestart={startGame} />}
      </div>
    </div>
  );
}

function Intro({ onStart }) {
  return (
    <div style={{ textAlign: "center", paddingTop: 24 }}>
      <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
        {CONCEPTS.map((c) => (
          <div key={c.id} style={{ width: 40, height: 40, borderRadius: "50%", background: c.color + "17", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <ConceptIcon id={c.id} color={c.color} size={20} />
          </div>
        ))}
      </div>
      <p style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: 1, color: MUTED }}>Memorama</p>
      <h1 style={{ fontSize: 30, margin: "8px 0 16px", fontFamily: "Georgia, serif" }}>Filosofía japonesa</h1>
      <p style={{ fontSize: 16, lineHeight: 1.6, maxWidth: 440, margin: "0 auto 32px", color: "#4A4436" }}>
        Encuentra las 8 parejas: cada palabra tiene una carta gemela en el
        tablero. A la derecha está el glosario — apenas encuentres las dos
        cartas de una palabra, su definición se desbloquea en verde. Al
        terminar se abre una breve introducción a la filosofía japonesa.
      </p>
      <button onClick={onStart} style={{ padding: "12px 26px", borderRadius: 6, color: "white", background: INK, border: "none", fontSize: 16, cursor: "pointer" }}>
        Empezar a jugar
      </button>
    </div>
  );
}

function Game({ deck, flipped, matched, attempts, allMatched, onFlip, onRestart, onContinue }) {
  const pct = Math.round((matched.length / CONCEPTS.length) * 100);
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <h2 style={{ fontSize: 20, fontFamily: "Georgia, serif", margin: 0 }}>Encuentra las parejas</h2>
        <div style={{ display: "flex", gap: 16, fontSize: 13, color: MUTED }}>
          <span>Aciertos: {matched.length}/8</span>
          <span>Intentos: {attempts}</span>
        </div>
      </div>

      <div style={{ height: 6, borderRadius: 999, background: HAIRLINE, marginBottom: 22, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: GREEN, borderRadius: 999, transition: "width .4s ease" }} />
      </div>

      <div className="layout">
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
          {deck.map((card, idx) => {
            const isFlipped = flipped.includes(idx) || card.matched;
            const accent = CONCEPTS.find((c) => c.id === card.conceptId).color;
            return (
              <button
                key={card.key}
                className={"card-btn" + (card.matched ? " just-matched" : "")}
                onClick={() => onFlip(idx)}
                disabled={card.matched}
                style={{
                  aspectRatio: "1 / 1",
                  borderRadius: 8,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  textAlign: "center", padding: 6, gap: 4,
                  background: isFlipped ? (card.matched ? GREEN + "14" : "white") : CARD_BACK,
                  border: `1.5px solid ${isFlipped ? (card.matched ? GREEN : HAIRLINE) : CARD_BACK}`,
                  cursor: card.matched ? "default" : "pointer",
                }}
              >
                {isFlipped ? (
                  <span key={card.key + "-face"} className="face-up" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                    {card.kind === "term" && <ConceptIcon id={card.conceptId} color={card.matched ? GREEN : accent} size={20} />}
                    <span style={{
                      fontSize: card.kind === "term" ? 13 : 9.5,
                      lineHeight: 1.25,
                      color: card.matched ? GREEN : INK,
                      fontFamily: card.kind === "term" ? "Georgia, serif" : "inherit",
                    }}>
                      {card.display}
                    </span>
                  </span>
                ) : (
                  <svg viewBox="0 0 40 40" width="14" height="14"><circle cx="20" cy="20" r="3" fill="#8B8577" /></svg>
                )}
              </button>
            );
          })}
        </div>

        <Sidebar matched={matched} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 28 }}>
        <button onClick={onRestart} style={{ fontSize: 14, textDecoration: "underline", color: "#7A6E56", background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <RestartIcon /> Reiniciar
        </button>
        {allMatched && (
          <button onClick={onContinue} style={{ padding: "10px 20px", borderRadius: 6, color: "white", background: AKANE, border: "none", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
            <CheckIcon color="white" /> Ver la filosofía japonesa <ArrowIcon />
          </button>
        )}
      </div>
    </div>
  );
}

function Sidebar({ matched }) {
  return (
    <aside style={{ marginTop: 20 }}>
      <p style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 1, color: MUTED, marginBottom: 10 }}>Glosario</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {CONCEPTS.map((c) => {
          const found = matched.includes(c.id);
          return (
            <div key={c.id} className={found ? "row-found" : ""} style={{
              borderRadius: 7, padding: "10px 12px", border: `1px solid ${found ? GREEN + "55" : HAIRLINE}`,
              background: found ? GREEN + "14" : "white", display: "flex", gap: 10, alignItems: "flex-start",
              opacity: found ? 1 : 0.55,
            }}>
              <div style={{ marginTop: 1 }}>
                {found ? <ConceptIcon id={c.id} color={GREEN} size={17} /> : <LockIcon />}
              </div>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 13.5, fontFamily: "Georgia, serif", color: found ? GREEN : INK }}>{c.term}</span>
                  {found && <CheckIcon />}
                </div>
                <p style={{ fontSize: 11.5, lineHeight: 1.4, margin: "2px 0 0", color: found ? "#2B2A28" : MUTED, filter: found ? "none" : "blur(1.5px)" }}>
                  {c.meaning}
                </p>
              </div>
            </div>
          );
        })}
      </div>
    </aside>
  );
}

function Overview({ onRestart }) {
  const sections = [
    { title: "Raíces", color: "#5C6E4F", text: "El pensamiento japonés se formó de la mezcla de tres corrientes: el sintoísmo nativo, que venera lo natural y lo transitorio; el budismo, llegado desde China y Corea; y el confucianismo, que aportó ética social y jerarquía. Ninguna reemplazó a las otras — conviven." },
    { title: "El Zen y la impermanencia", color: "#3E5C76", text: "El budismo Zen insiste en la experiencia directa por encima de la teoría: la iluminación (satori) se busca a través de la meditación (zazen), no del razonamiento. De ahí nace una sensibilidad por lo pasajero — mono no aware — y por el vacío o pausa entre las cosas — ma." },
    { title: "El Bushido", color: "#B23A2F", text: "El código samurái convirtió virtudes como la lealtad, el honor y el autocontrol en una ética práctica. Su influencia se extiende hoy a la disciplina, el trabajo en equipo y el respeto por los rituales cotidianos." },
    { title: "Estética de lo imperfecto", color: "#B8862B", text: "El wabi-sabi encuentra belleza en lo desgastado, asimétrico e incompleto — lo opuesto a la perfección. Es visible en la cerámica reparada con oro (kintsugi) y en jardines que envejecen a propósito." },
    { title: "Filosofía de la vida diaria", color: "#6B7A3A", text: "Conceptos como el ikigai (razón de ser), el kaizen (mejora continua) y el mottainai (no desperdiciar) muestran que, en Japón, la filosofía no siempre es abstracta: también es una forma práctica de vivir y trabajar." },
    { title: "El siglo XX: la Escuela de Kioto", color: "#22303C", text: "En el siglo XX, filósofos como Nishida Kitarō intentaron construir un sistema filosófico propiamente japonés, poniendo en diálogo el pensamiento occidental (Hegel, Kant) con conceptos budistas como la 'nada absoluta'." },
  ];

  return (
    <div className="banner">
      <p style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: 1, color: GREEN, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>
        <CheckIcon /> Desbloqueado
      </p>
      <h2 style={{ fontSize: 24, fontFamily: "Georgia, serif", marginTop: 0, marginBottom: 24 }}>Una introducción a la filosofía japonesa</h2>

      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 28 }}>
        {sections.map((s, i) => (
          <div key={i} style={{ borderRadius: 6, padding: 16, border: `1px solid ${HAIRLINE}`, borderLeft: `4px solid ${s.color}`, background: "white" }}>
            <p style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, color: s.color, marginTop: 0, marginBottom: 6 }}>{s.title}</p>
            <p style={{ fontSize: 14, lineHeight: 1.6, margin: 0 }}>{s.text}</p>
          </div>
        ))}
      </div>

      <div style={{ borderRadius: 6, padding: 16, marginBottom: 28, background: PAPER, border: `1px solid ${HAIRLINE}` }}>
        <p style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, color: MUTED, marginTop: 0, marginBottom: 10 }}>Glosario completo</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {CONCEPTS.map((c) => (
            <span key={c.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, padding: "5px 10px", borderRadius: 999, background: "white", border: `1px solid ${HAIRLINE}` }}>
              <ConceptIcon id={c.id} color={c.color} size={14} /> {c.term}
            </span>
          ))}
        </div>
      </div>

      <button onClick={onRestart} style={{ fontSize: 14, textDecoration: "underline", color: "#7A6E56", background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
        <RestartIcon /> Jugar de nuevo
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
