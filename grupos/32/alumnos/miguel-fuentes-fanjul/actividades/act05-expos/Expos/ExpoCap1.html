<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--grid:#d9dde6;--ink:#1b2236;--mut:#5a6279;--paper:#fffdf8;--pf:#1b2236;
--c1:#2f5fd0;--f1:#fff;--c2:#f2b632;--f2:#1b2236;--c3:#f08aa8;--f3:#1b2236;--c4:#9fd8c1;--f4:#1b2236;--c5:#1b2236;--f5:#fff;
--fd:'Bricolage Grotesque','Trebuchet MS',sans-serif;--fb:'Source Serif 4',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d27;--grid:#262a38;--ink:#f1f1f6;--mut:#a4a9bd}}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
header{max-width:1180px;margin:0 auto;padding:36px 20px 8px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.num{font:800 clamp(5rem,14vw,9rem)/.8 var(--fd);color:var(--f2);background:var(--c2);padding:.12em .2em .06em;transform:rotate(-4deg);box-shadow:6px 6px 0 var(--c5);flex:none}
h1{font:800 clamp(2rem,5.5vw,3.6rem)/1.02 var(--fd);margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0;max-width:56ch;color:var(--mut)}
.clock{width:110px;height:110px;margin-left:auto;flex:none}
.bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.chip,.btn{font:600 .85rem var(--fb);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{margin-left:auto;border-radius:6px;box-shadow:3px 3px 0 var(--c1)}
.btn+.btn{margin-left:0}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible,.x:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.prog{width:100%;display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--mut)}
.prog i{flex:1;height:6px;background:var(--grid);border-radius:9px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--c1);transition:width .4s}
#board{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-flow:dense;gap:26px 22px}
.card{position:relative;padding:22px 18px 16px;min-height:170px;cursor:pointer;user-select:none;touch-action:manipulation;
transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--r,0deg));box-shadow:5px 5px 0 rgba(20,25,45,.85);transition:box-shadow .15s,opacity .25s;display:flex;flex-direction:column;gap:4px}
.card:hover{box-shadow:8px 8px 0 rgba(20,25,45,.85)}
.card.drag{cursor:grabbing;z-index:15;box-shadow:12px 14px 0 rgba(20,25,45,.6);transition:none}
.card:before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.12);transform:rotate(calc(var(--r,0deg) * -2))}
.card.s2{grid-column:span 2}
.card.round{border-radius:46% 54% 50% 50%/55% 45% 55% 45%;text-align:center;align-items:center;justify-content:center;padding:30px 26px}
.card.cut{clip-path:polygon(0 4%,6% 0,100% 2%,98% 96%,92% 100%,3% 98%);box-shadow:none}
.card.dim{opacity:.22}
.k0{background:var(--paper);color:var(--pf)}
.k1{background:var(--c1);color:var(--f1)}.k2{background:var(--c2);color:var(--f2)}.k3{background:var(--c3);color:var(--f3)}.k4{background:var(--c4);color:var(--f4)}.k5{background:var(--c5);color:var(--f5)}
.tag{font:700 .72rem var(--fb);letter-spacing:.02em;opacity:.75}
.big{font:800 clamp(2.2rem,5vw,3.2rem)/1 var(--fd);margin:2px 0}
.card h3{font:700 1.2rem/1.15 var(--fd);margin:0}
.card p{margin:4px 0 0;font-size:.92rem;line-height:1.4}
.seen{position:absolute;right:10px;top:8px;font-style:normal;font-weight:800;opacity:0;transform:scale(.4);transition:.25s}
.card.vis .seen{opacity:1;transform:none}
dialog{width:min(640px,calc(100vw - 28px));max-height:86vh;border:3px solid var(--ink);background:var(--paper);color:var(--pf);padding:0;box-shadow:10px 10px 0 var(--c1);overflow:auto}
dialog::backdrop{background:rgba(15,18,32,.6)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92) rotate(-2deg);opacity:0}}
.dh{display:flex;gap:12px;align-items:flex-start;padding:20px 22px 12px;position:sticky;top:0;background:var(--paper);border-bottom:2px dashed rgba(0,0,0,.15)}
.dh h2{font:800 1.6rem/1.1 var(--fd);margin:0}
.dh small{display:block;font-weight:700;opacity:.65}
.x{margin-left:auto;font:700 1.2rem var(--fb);width:38px;height:38px;border:2px solid var(--pf);background:var(--c2);color:var(--f2);cursor:pointer;flex:none}
.db{padding:14px 22px 24px}
.db h4{font:700 1rem var(--fd);margin:18px 0 6px}
.db ul,.db ol{padding-left:1.2em;margin:6px 0}
.db li{margin:3px 0}
.db blockquote{margin:12px 0;padding:8px 14px;border-left:5px solid var(--c2);font-style:italic}
.db .tw{overflow-x:auto}
.db table{border-collapse:collapse;width:100%;font-size:.88rem}
.db th,.db td{border:1.5px solid rgba(0,0,0,.25);padding:6px 8px;text-align:left;vertical-align:top}
.db th{background:var(--c4);color:var(--f4)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.mx div{padding:10px;font-size:.88rem}.mx b{display:block}
.q1{background:var(--c3);color:var(--f3)}.q2{background:var(--c4);color:var(--f4)}.q3{background:var(--c2);color:var(--f2)}.q4{background:var(--grid);color:var(--pf)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair>div{padding:10px;background:rgba(0,0,0,.05)}
.meter{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}.meter span{width:150px;flex:none}.meter i{height:14px;background:var(--c1)}
@media (max-width:560px){.card.s2{grid-column:span 1}.pair{grid-template-columns:1fr}.meter span{width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<header>
<div class="num" aria-hidden="true">1</div>
<div><h1>Habilidades directivas y su clasificación</h1><p class="sub">Conocer qué son las habilidades directivas, cómo se clasifican y cómo desarrollarlas. Toca una pieza para abrirla; arrástrala si usas mouse.</p></div>

</header>

<button class="btn" id="rst" type="button">Ordenar</button>
</div>
<main id="board" aria-label="Collage interactivo"></main>
<dialog id="dlg" aria-labelledby="dt"><div class="dh"><div><small id="dg"></small><h2 id="dt"></h2></div><button class="x" id="dx" aria-label="Cerrar" type="button">×</button></div><div class="db" id="dd"></div></dialog>
<script>
const D=[
{c:2,g:"Conceptos",t:"Qué es una habilidad",p:"Capacidad adquirida por aprendizaje para producir resultados previstos con máxima certeza.",d:"<p>Siguiendo a Guthie Knapp (2007), la habilidad es la <b>capacidad del individuo, adquirida por el aprendizaje</b>, capaz de producir resultados previstos con el máximo de certeza, el mínimo de tiempo y economía, y el máximo de seguridad.</p><p><b>Objetivo del libro:</b> que el directivo conozca, analice, descubra y desarrolle sus habilidades para alcanzar objetivos determinados.</p>",k:"",s:2,sh:""},
{c:1,g:"Conceptos",t:"Se aprenden",p:"Las habilidades se cultivan y se educan.",d:"<p>Las habilidades se vinculan a una tarea, implican un entorno, se demuestran con regularidad y eficacia y, sobre todo, <b>se aprenden</b>.</p><blockquote>Drucker: “Hay dos tipos de personas: las que nacieron para mandar y a las que les gusta que las manden.”</blockquote><p>El capítulo rompe ese paradigma: hoy se enseñan en cursos, talleres, especialidades, maestrías y doctorados. Como dice Enebral: ¡se aprende a pensar!</p>",k:"",s:1,sh:"round"},
{c:0,g:"Clasificación",t:"Once tipos de habilidades",p:"Técnicas, interpersonales, sociales, de liderazgo, empresariales…",d:"<div class=\"tw\"><table><tr><th>Habilidad</th><th>Alcance</th></tr><tr><td>Técnicas</td><td>Desarrollar tareas específicas</td></tr><tr><td>Interpersonales</td><td>Trabajo en grupo, colaboración y cooperación</td></tr><tr><td>Sociales</td><td>Intercambio y convivencia humana</td></tr><tr><td>Académicas</td><td>Análisis, comparación, evaluación, juicio</td></tr><tr><td>De innovación</td><td>Invención, hipótesis, teorización</td></tr><tr><td>Prácticas</td><td>Aplicación, empleo, implementación</td></tr><tr><td>Físicas</td><td>Autoeficiencia, flexibilidad, salud</td></tr><tr><td>De pensamiento</td><td>Aprender a pensar y generar conocimiento</td></tr><tr><td>Directivas</td><td>Dirigir y coordinar equipos</td></tr><tr><td>De liderazgo</td><td>Guiar, impulsar y motivar al bien común</td></tr><tr><td>Empresariales</td><td>Emprender ideas, proyectos o negocios</td></tr></table></div>",k:"11",s:1,sh:""},
{c:4,g:"Clasificación",t:"Conceptuales",p:"Ver la organización como un todo.",d:"<p>Destreza para coordinar e interpretar ideas, conceptos y prácticas; analizar, predecir y planificar teniendo en cuenta el contexto interno y externo. El directivo debe conocer:</p><ul><li>Organizaciones</li><li>Administración</li><li>Planeación estratégica</li><li>Ciencias del comportamiento (psicología, sociología, antropología)</li><li>Aspectos culturales y regionales</li><li>Globalización y ambiente</li></ul>",k:"",s:1,sh:""},
{c:3,g:"Clasificación",t:"Técnicas y profesionales",p:"Dominio de una carrera o práctica para resolver tareas específicas.",d:"<p>Capacidad de usar, a favor propio o del grupo, los recursos y relaciones necesarios para desarrollar tareas específicas y afrontar los problemas que se presenten. Requiere dominar una carrera o práctica profesional: ingeniería, administración, medicina, etcétera.</p>",k:"",s:1,sh:""},
{c:5,g:"Clasificación",t:"Interpersonales",p:"Motivar y conducir al grupo hacia propósitos comunes.",d:"<p>Trabajar en grupo con colaboración, cortesía y cooperación. Influyen en los demás mediante la motivación y una conducción efectiva del grupo.</p><ul><li>Motivación</li><li>Inteligencia emocional</li><li>Dirección y supervisión</li><li>Delegación y facultamiento</li><li>Estilos de liderazgo</li><li>Manejo de estrés y calidad de vida</li><li>Actitud ante el cambio</li><li>Presentación del directivo</li><li>Administración estratégica</li><li>Maquiavelismo y liderazgo</li><li>Administración del tiempo</li><li>Habilidades del pensamiento</li><li>Negociación</li></ul>",k:"",s:1,sh:""},
{c:2,g:"Clasificación",t:"Sociales: 6 grupos",p:"J. Nelly las divide en seis grupos, de escuchar a planificar.",d:"<p>Las habilidades sociales no son un rasgo de personalidad: son <b>comportamientos aprendidos y adquiridos</b>.</p><ol><li><b>Primeras:</b> escuchar, iniciar y mantener una conversación, preguntar, agradecer, presentar</li><li><b>Avanzadas:</b> pedir ayuda, participar, dar y seguir instrucciones, disculparse, convencer</li><li><b>Sentimientos:</b> conocer y expresar los propios, comprender los ajenos, expresar afecto</li><li><b>Alternativas a la agresión:</b> pedir permiso, negociar, autocontrol, defender derechos</li><li><b>Frente al estrés:</b> formular y responder quejas, responder al fracaso, conversaciones difíciles</li><li><b>Planificación:</b> tomar iniciativas, establecer un objetivo, recoger información, decidir, concentrarse</li></ol>",k:"",s:2,sh:""},
{c:4,g:"Clasificación",t:"Programa PEHIS",p:"Seis áreas de interacción social (Monjas, 1993).",d:"<p>Considerado uno de los más completos:</p><ul><li>Interacción social básica (sonreír, saludar, cortesía)</li><li>Hacer amigos (reforzar, ayudar, cooperar)</li><li>Conversacionales (iniciar, mantener, terminar)</li><li>Sentimientos, emociones y opiniones</li><li>Solución de problemas interpersonales</li><li>Relacionarse con adultos</li></ul>",k:"",s:1,sh:""},
{c:1,g:"Liderazgo",t:"Siete megahabilidades",p:"Del liderazgo, según Nanus (1989), adaptado por Boyett (1998).",d:"<div class=\"tw\"><table><tr><th>Megahabilidad</th><th>Significado</th></tr><tr><td>Visión de futuro</td><td>Mantiene la vista en el horizonte lejano y camina hacia él</td></tr><tr><td>Dominio de los cambios</td><td>Regula velocidad, dirección y ritmo del cambio</td></tr><tr><td>Diseño de la organización</td><td>Constructor cuyo legado es una organización capaz de triunfar</td></tr><tr><td>Aprendizaje anticipado</td><td>Aprendiz de por vida que promueve el aprendizaje organizacional</td></tr><tr><td>Iniciativa</td><td>Hace que las cosas sucedan</td></tr><tr><td>Dominio de la independencia</td><td>Inspira ideas, confianza y soluciones colaborativas</td></tr><tr><td>Altos niveles de integridad</td><td>Serio, honesto, tolerante, confiable y leal</td></tr></table></div>",k:"7",s:1,sh:""},
{c:3,g:"Liderazgo",t:"Saber · Saber hacer · Saber ser",p:"El trinomio del directivo exitoso.",d:"<div class=\"pair\"><div><b>Saber</b><br>Conocimientos</div><div><b>Saber hacer</b><br>Habilidades y capacidades</div><div><b>Saber ser</b><br>Cualidades</div><div><b>Resultado</b><br>Lo que se espera de él</div></div><blockquote>Drucker: “Dirigir no es más que obtener resultados a través de otros.”</blockquote><p>Un problema frecuente es la improvisación: se ofrece un puesto directivo solo porque alguien tiene carrera, y al no aceptar su falta de preparación, no se capacita.</p>",k:"",s:1,sh:"cut"},
{c:4,g:"Liderazgo",t:"Habilidades para la vida",p:"Las cinco que sugirió la OMS (1999).",d:"<ul><li>Toma de decisiones y solución de problemas</li><li>Pensamiento creativo y analítico</li><li>Comunicación y habilidades interpersonales</li><li>Autoconocimiento y empatía</li><li>Manejo de las emociones y del estrés</li></ul><p>El libro desarrolla 18 habilidades, una por capítulo. La clave: aprender a autodirigirse y ser el propio líder.</p>",k:"",s:1,sh:""},
{c:3,g:"Liderazgo",t:"Teoría trifásica",p:"Después de varios días recordamos más lo que hacemos.",d:"<p>Alumno, líder y directivo aprenden, analizan, aplican e innovan. Proverbio chino: escucho y olvido, leo y comprendo, veo y recuerdo, <b>hago y aprendo</b>.</p><div class=\"meter\"><span>Lo que vemos</span><i style=\"width:30%\"></i>30%</div><div class=\"meter\"><span>Lo que oímos</span><i style=\"width:20%\"></i>20%</div><div class=\"meter\"><span>Vemos y oímos</span><i style=\"width:50%\"></i>50%</div><div class=\"meter\"><span>Lo que platicamos</span><i style=\"width:70%\"></i>70%</div><div class=\"meter\"><span>Lo que hacemos</span><i style=\"width:90%\"></i>90%</div>",k:"90%",s:1,sh:"round"},
{c:2,g:"Investigación",t:"Cuatro directivos",p:"Mismo puesto, perfiles distintos, resultados distintos.",d:"<p>Investigación de campo en el occidente de México (2006–2007).</p><div class=\"tw\"><table><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td>Mando</td><td>Delegador</td><td>Centralista</td><td>Centralista</td><td>Centralista</td></tr><tr><td>Liderazgo</td><td>Paternalista</td><td>Autoritario</td><td>Dejar hacer</td><td>Delegador</td></tr><tr><td>Hab. sociales</td><td>Ausentes</td><td>Hacia la comedia</td><td>Ausentes</td><td>Ausentes</td></tr><tr><td>Hab. técnicas</td><td>Contables</td><td>Docencia</td><td>Investigación</td><td>Económicas</td></tr><tr><td>Resultados</td><td>Medio</td><td>Alto</td><td>Bajo</td><td>Medio</td></tr></table></div><p>No son perfiles ideales: muestran el impacto de la personalidad y del dominio (o ausencia) de habilidades.</p>",k:"4",s:2,sh:""},
{c:5,g:"Investigación",t:"Cuatro consejeras",p:"Perfil homogéneo, ambientes organizacionales distintos.",d:"<div class=\"tw\"><table><tr><th></th><th>Estilo</th><th>Resultado</th></tr><tr><td>A</td><td>Autoritario</td><td>Logro, pero inconformidad del equipo</td></tr><tr><td>B</td><td>Participativo</td><td>Logro, pero divisionismo</td></tr><tr><td>C</td><td>Participativo y democrático</td><td>Caos, indecisión y división</td></tr><tr><td>D</td><td>Autoritario y centralista</td><td>Logro, pero equipo cansado</td></tr></table></div><p>Con estudiantes de edad y metas similares, lo que marca la diferencia es el dominio o ausencia de habilidades directivas.</p>",k:"",s:1,sh:""},
{c:1,g:"Mundo global",t:"Globalización e internacionalización",p:"La segunda es la respuesta a la primera.",d:"<p><b>Globalización:</b> flujo de tecnología, ideas y valores que trasciende fronteras y destaca diferencias.</p><p><b>Internacionalización:</b> esfuerzo por responder a sus retos, conociendo idiosincrasia y valores.</p><h4>Cuatro aprendizajes</h4><ul><li>Vivir juntos, con otras culturas</li><li>Aprender a lo largo de la vida</li><li>Enfrentar situaciones imprevisibles</li><li>Aprender a vivir la vida</li></ul><p>Y reforzar: conocer, hacer, vivir juntos, ser y emprender.</p>",k:"",s:1,sh:""},
{c:4,g:"Mundo global",t:"Interacción bicultural",p:"Reconocer diferencias, comparar perspectivas, diagnosticar.",d:"<p>Delgado y Madrigal (2007): en las fronteras culturales el tiempo, el respeto, el espacio y la comunicación son clave.</p><p>El libro lista 15 habilidades cognoscitivas, entre ellas:</p><ul><li>Reconocer las diferencias culturales</li><li>Pensamiento comparativo: moverse de una perspectiva a otra</li><li>Comunicación intercultural</li><li>Diagnóstico: en quién confiar y qué es importante</li><li>Comprender la complejidad y la integración cognoscitivas</li></ul><p>Un directivo visionario suma conciencia del planeta, del ambiente y de la dinámica global.</p>",k:"",s:1,sh:""},
{c:3,g:"Mundo global",t:"Movilidad profesional",p:"Del siglo XX al XXI, el directivo cambia más veces de trabajo.",d:"<div class=\"meter\"><span>Siglo XX</span><i style=\"width:40%\"></i>3 a 4 cambios</div><div class=\"meter\"><span>Siglo XXI</span><i style=\"width:100%\"></i>8 a 10 cambios</div><p>Exige reforzar las competencias intelectuales y del pensamiento acumuladas en la trayectoria. Drucker afirmaba que las habilidades y la competitividad del ejecutivo también se pueden aprender.</p>",k:"8–10",s:1,sh:"round"},
{c:2,g:"Investigación",t:"Caso: Rodrigo",p:"Un investigador brillante que no logró dirigir.",d:"<p>Rodrigo llega a la cima del centro de investigación más reconocido del país. Promete un proyecto de vinculación interinstitucional, pero en tres años se registran <b>20 reuniones</b> sin consolidarlo. Un mando intermedio lo frena (“¡Ya estando el pastel listo, todos van a querer comérselo!”) y el directivo concluye: “¡Qué flojera tener que lidiar con esta gente!”. Pierde el puesto y la institución pierde credibilidad y recursos.</p><h4>Para discutir</h4><ul><li>¿Qué habilidades le faltaron al directivo?</li><li>¿Qué haría usted en su caso?</li><li>¿Cuánto tiempo perdió el centro de investigación?</li><li>¿Cuánto tiempo perdieron los directivos?</li></ul>",k:"20",s:1,sh:""},
{c:4,g:"Liderazgo",t:"Ejercicio en equipo",p:"Un reto ambiental para detectar liderazgos.",d:"<ol><li>Formen equipos e identifiquen algo que se pueda cambiar para cuidar el ambiente: diagnóstico, estrategias, acciones y cronograma.</li><li>Cada equipo elige un líder voluntario.</li><li>Cinco voluntarios exponen el proyecto.</li><li>Reto final: integrar un solo equipo con todo el grupo.</li></ol><p>Observe habilidades sociales (quien acepta el reto de inmediato), interpersonales, técnicas y la capacidad de consolidar un equipo.</p>",k:"",s:1,sh:"cut"}
];
const $=s=>document.getElementById(s),B=$('board'),dlg=$('dlg'),seen=new Set();
const rot=i=>Math.sin(i*12.9898+1.7)*3.2;
function build(){B.innerHTML='';D.forEach((c,i)=>{
const e=document.createElement('article');e.className=`card k${c.c} s${c.s||1} ${c.sh||''}`;e.tabIndex=0;e.dataset.g=c.g;e.dataset.i=i;
e.style.setProperty('--r',rot(i)+'deg');
e.innerHTML=`<span class="tag">${c.g}</span>${c.k?`<b class="big">${c.k}</b>`:''}<h3>${c.t}</h3><p>${c.p}</p><i class="seen" aria-hidden="true">✓</i>`;
if(seen.has(i))e.classList.add('vis');
B.appendChild(e);});}
let moved=false;
B.addEventListener('pointerdown',ev=>{
const c=ev.target.closest('.card');if(!c||ev.pointerType!=='mouse')return;
const sx=ev.clientX,sy=ev.clientY,ox=parseFloat(c.style.getPropertyValue('--dx'))||0,oy=parseFloat(c.style.getPropertyValue('--dy'))||0;moved=false;
const mv=m=>{const dx=m.clientX-sx,dy=m.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;c.classList.add('drag');
c.style.setProperty('--dx',ox+dx+'px');c.style.setProperty('--dy',oy+dy+'px');};
const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);c.classList.remove('drag');setTimeout(()=>moved=false,0)};
addEventListener('pointermove',mv);addEventListener('pointerup',up);});
function open(c){const i=+c.dataset.i,d=D[i];$('dg').textContent=d.g;$('dt').textContent=d.t.replace(/<[^>]+>/g,'');$('dd').innerHTML=d.d;
dlg.showModal();seen.add(i);c.classList.add('vis');prog();}
B.addEventListener('click',ev=>{const c=ev.target.closest('.card');if(c&&!moved)open(c)});
B.addEventListener('keydown',ev=>{const c=ev.target.closest('.card');if(c&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();open(c)}});
$('dx').onclick=()=>dlg.close();
dlg.addEventListener('click',ev=>{if(ev.target===dlg)dlg.close()});
function prog(){$('pt').textContent=`Exploradas ${seen.size} de ${D.length}`;$('pb').style.width=seen.size/D.length*100+'%'}
const gs=[...new Set(D.map(d=>d.g))];let act=null;
gs.forEach(g=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=g;b.setAttribute('aria-pressed','false');
b.onclick=()=>{act=act===g?null:g;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.textContent===act)));
document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim',!!act&&c.dataset.g!==act))};$('chips').appendChild(b)});
$('mix').onclick=()=>{const k=[...B.children].sort(()=>Math.random()-.5);k.forEach(c=>{B.appendChild(c);c.style.setProperty('--r',(Math.random()*8-4)+'deg');c.style.setProperty('--dx','0px');c.style.setProperty('--dy','0px')})};
$('rst').onclick=()=>{[...B.children].sort((a,b)=>a.dataset.i-b.dataset.i).forEach(c=>{B.appendChild(c);c.style.setProperty('--r',rot(+c.dataset.i)+'deg');c.style.setProperty('--dx','0px');c.style.setProperty('--dy','0px')})};
build();prog();

</script>
