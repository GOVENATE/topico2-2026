<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinámica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container dynamic-page">
      <a href="second.html" class="back-button" aria-label="Regresar">Regresar</a>

      <section class="dynamic-card">
        <div class="dynamic-info">
          <h2>Sopa de letras</h2>
          <p>Encuentra las palabras relacionadas con los 7 hábitos.</p>
          <div id="wordList" class="word-list"></div>
        </div>

        <div class="dynamic-play">
          <div id="board" class="board"></div>
          <div class="dynamic-actions">
            <p id="message" class="message">Selecciona las letras arrastrando el mouse.</p>
            <button id="restartBtn" class="secondary-button">Reiniciar</button>
          </div>
        </div>
      </section>

      <img src="logo.png" alt="Logo pequeño" class="small-logo" />
    </main>

    <script>
      const words = ["PROACTIVIDAD", "SINERGIA", "METAS", "EMPATIA", "PRIORIZAR"];
      const size = 12;
      const directions = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
      ];

      let board = [];
      let placedWords = [];
      let foundWords = new Set();
      let selection = [];
      let selecting = false;

      const boardEl = document.getElementById("board");
      const wordListEl = document.getElementById("wordList");
      const messageEl = document.getElementById("message");
      const restartBtn = document.getElementById("restartBtn");

      function randomLetter() {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        return alphabet[Math.floor(Math.random() * alphabet.length)];
      }

      function canPlace(word, row, col, dr, dc) {
        for (let i = 0; i < word.length; i++) {
          const r = row + dr * i;
          const c = col + dc * i;
          if (r < 0 || r >= size || c < 0 || c >= size) return false;
          const current = board[r][c];
          if (current !== "" && current !== word[i]) return false;
        }
        return true;
      }

      function placeWord(word) {
        const tries = 200;
        for (let attempt = 0; attempt < tries; attempt++) {
          const dr = directions[Math.floor(Math.random() * directions.length)];
          const row = Math.floor(Math.random() * size);
          const col = Math.floor(Math.random() * size);
          if (canPlace(word, row, col, dr[0], dr[1])) {
            for (let i = 0; i < word.length; i++) {
              const r = row + dr[0] * i;
              const c = col + dr[1] * i;
              board[r][c] = word[i];
            }
            placedWords.push({ word, row, col, dr: dr[0], dc: dr[1] });
            return true;
          }
        }
        return false;
      }

      function buildBoard() {
        board = Array.from({ length: size }, () => Array(size).fill(""));
        placedWords = [];
        const sortedWords = [...words].sort((a, b) => b.length - a.length);

        sortedWords.forEach((word) => {
          if (!placeWord(word)) {
            console.warn("No se pudo colocar:", word);
          }
        });

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === "") board[r][c] = randomLetter();
          }
        }
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        board.forEach((row, rowIndex) => {
          row.forEach((letter, colIndex) => {
            const cell = document.createElement("button");
            cell.className = "cell";
            cell.textContent = letter;
            cell.dataset.row = rowIndex;
            cell.dataset.col = colIndex;
            cell.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              selecting = true;
              selection = [{ row: rowIndex, col: colIndex }];
              updateSelectionVisual();
            });
            cell.addEventListener("pointerenter", () => {
              if (selecting) {
                const last = selection[selection.length - 1];
                if (last.row === rowIndex && last.col === colIndex) return;
                selection.push({ row: rowIndex, col: colIndex });
                updateSelectionVisual();
              }
            });
            boardEl.appendChild(cell);
          });
        });
      }

      function updateSelectionVisual() {
        document.querySelectorAll(".cell").forEach((cell) => {
          cell.classList.remove("selected");
          cell.classList.remove("found");
        });

        const allCells = document.querySelectorAll(".cell");
        const foundCells = new Set();
        foundWords.forEach((word) => {
          placedWords.forEach((item) => {
            if (item.word === word) {
              for (let i = 0; i < word.length; i++) {
                const r = item.row + item.dr * i;
                const c = item.col + item.dc * i;
                foundCells.add(`${r}-${c}`);
              }
            }
          });
        });

        allCells.forEach((cell) => {
          const key = `${cell.dataset.row}-${cell.dataset.col}`;
          if (foundCells.has(key)) cell.classList.add("found");
        });

        selection.forEach((pos) => {
          const target = document.querySelector(`.cell[data-row="${pos.row}"][data-col="${pos.col}"]`);
          if (target) target.classList.add("selected");
        });
      }

      function getSelectedWord() {
        if (selection.length < 2) return "";
        let word = "";
        const first = selection[0];
        const last = selection[selection.length - 1];
        const dr = last.row - first.row;
        const dc = last.col - first.col;
        const stepRow = selection.length > 1 ? Math.sign(dr) : 0;
        const stepCol = selection.length > 1 ? Math.sign(dc) : 0;
        if (stepRow === 0 && stepCol === 0) return "";
        const cells = [];
        for (let i = 0; i < selection.length; i++) {
          cells.push(board[selection[i].row][selection[i].col]);
        }
        return cells.join("");
      }

      function checkSelection() {
        const word = getSelectedWord();
        const normalized = word.toUpperCase();
        if (!normalized) return;
        if (words.includes(normalized) || words.includes(normalized.split("").reverse().join(""))) {
          const actualWord = words.includes(normalized) ? normalized : normalized.split("").reverse().join("");
          if (!foundWords.has(actualWord)) {
            foundWords.add(actualWord);
            renderWordList();
            messageEl.textContent = `¡Encontraste ${actualWord}!`;
            if (foundWords.size === words.length) {
              messageEl.textContent = "¡Ganaste!";
            }
          }
        }
        selection = [];
        selecting = false;
        updateSelectionVisual();
      }

      function renderWordList() {
        wordListEl.innerHTML = "";
        words.forEach((word) => {
          const item = document.createElement("div");
          item.className = "word-item";
          if (foundWords.has(word)) item.classList.add("found-word");
          item.textContent = word;
          wordListEl.appendChild(item);
        });
      }

      function startGame() {
        buildBoard();
        renderBoard();
        renderWordList();
        foundWords = new Set();
        selection = [];
        selecting = false;
        messageEl.textContent = "Selecciona las letras arrastrando el mouse.";
      }

      restartBtn.addEventListener("click", startGame);
      window.addEventListener("pointerup", checkSelection);
      window.addEventListener("pointerleave", () => {
        if (selecting) checkSelection();
      });

      startGame();
    </script>
  </body>
</html>
