let page='inicio',currentTopic=0,labIndex=0,labResult=null,labShowSolution=false,quizAt=0,quizSelections=[],inspectorFlags=[true,true,false,false,true,false,false],scenarioAt=0,scenarioAnswers=[],lessonOpen=null;
const topics=[
{num:'01',name:'Código limpio',page:21,tag:'La mentalidad',concept:'Escribir código que se entienda y se pueda mantener importa tanto como hacerlo funcionar.',detail:'Martin explica que el código desordenado impone un costo acumulativo: cada cambio se vuelve más difícil y la velocidad del equipo disminuye. La calidad no se agrega únicamente al terminar; se trabaja en cada modificación.',principles:['Legibilidad antes que trucos','La prisa no justifica la deuda permanente','Dejar el código un poco mejor'],bad:'// Funciona, pero no comunica su intención\nconst r = x * 1.16;',good:'// Expresa qué se calcula\nconst totalConImpuesto = subtotal * 1.16;',exercise:'Piensa en una función de un proyecto escolar. ¿Podría otra persona identificar qué hace sin que tú se lo expliques?',tip:'No confundas código corto con código claro. El criterio es que comunique intención.'},
{num:'02',name:'Nombres con sentido',page:41,tag:'Claridad',concept:'Un buen nombre explica la intención, no obliga a adivinarla.',detail:'El capítulo recomienda nombres descriptivos y pronunciables, evitar información engañosa, codificaciones innecesarias y diferencias demasiado sutiles. Las variables y funciones son parte del lenguaje con el que otros comprenderán el sistema.',principles:['Describir intención y contexto','Evitar abreviaturas ambiguas','Preferir vocabulario consistente'],bad:'const d = 5;\nconst p = 120;\nconst x = d * p;',good:'const cantidadProductos = 5;\nconst precioUnitario = 120;\nconst totalCompra = cantidadProductos * precioUnitario;',exercise:'Cambia los nombres de tres variables vagas de tu código y explica qué hacen sin comentarios.',tip:'Un nombre largo que explica suele ser más útil que una sola letra.'},
{num:'03',name:'Funciones',page:59,tag:'Una responsabilidad',concept:'Las funciones pequeñas, enfocadas y con poca complejidad son más fáciles de comprender.',detail:'Martin desarrolla la idea de que una función debe realizar una tarea reconocible y expresar un nivel de abstracción consistente. Dividir operaciones ayuda a aislar decisiones, detectar errores y reutilizar comportamientos sin crear funciones arbitrarias.',principles:['Hacer una cosa por función','Usar nombres verbales descriptivos','Reducir efectos secundarios y argumentos'],bad:'function guardar(u){\n  if(!u.nombre) throw Error("x");\n  u.nombre=u.nombre.trim();\n  console.log("Guardando",u);\n  baseDeDatos.insert(u);\n}',good:'function registrarUsuario(usuario){\n  validarUsuario(usuario);\n  const usuarioLimpio = normalizarUsuario(usuario);\n  guardarUsuario(usuarioLimpio);\n}',exercise:'Encuentra una función que valide, transforme y guarde datos. Sepárala en acciones con nombre.',tip:'Separar funciones tiene sentido cuando mejora la lectura y la cohesión.'},
{num:'04',name:'Comentarios',page:87,tag:'Expresar con código',concept:'Los comentarios útiles explican el porqué; los innecesarios repiten lo que el código ya dice.',detail:'El autor advierte que los comentarios pueden desactualizarse y ocultar problemas de expresividad. En vez de usarlos para explicar lógica confusa, es preferible revisar los nombres y la estructura, sin descartar comentarios que aportan contexto real.',principles:['Evitar comentarios redundantes','Documentar decisiones poco evidentes','No usar comentarios para tapar código confuso'],bad:'// Comprueba si el usuario es mayor de edad\nif (u.edad >= 18) { activar(u); }',good:'if (esMayorDeEdad(usuario)) {\n  activarCuenta(usuario);\n}',exercise:'Elige un comentario que describa línea por línea lo que hace tu función y conviértelo en un nombre claro.',tip:'Un comentario de negocio útil puede explicar por qué se aplica una regla.'},
{num:'05',name:'Formato',page:113,tag:'Legibilidad visual',concept:'La organización visual ayuda a entender relaciones y a navegar el archivo.',detail:'El capítulo aborda separación vertical, proximidad entre elementos relacionados, indentación y estilo de equipo. Un formato coherente reduce la carga de lectura y facilita reconocer bloques lógicos, incluso en código que uno no escribió.',principles:['Agrupar líneas relacionadas','Mantener indentación consistente','Usar convenciones compartidas'],bad:'function total(p){let t=0;for(let x of p){t+=x.precio;}return t;}',good:'function calcularTotal(productos) {\n  let total = 0;\n  for (const producto of productos) {\n    total += producto.precio;\n  }\n  return total;\n}',exercise:'Da formato a una función de diez líneas y compara cuánto tardas en entenderla.',tip:'El formato es una herramienta de comunicación, no únicamente decoración.'},
{num:'06',name:'Errores y límites',page:146,tag:'Robustez',concept:'Los errores deben manejarse con claridad y sin ocultar información importante.',detail:'En «Procesar errores» se enfatiza separar la lógica principal del manejo de errores y aportar contexto cuando algo falla. El capítulo de límites considera las dependencias externas y el valor de aislar sus detalles detrás de interfaces propias.',principles:['No silenciar fallos importantes','Mensajes que aporten contexto','Aislar dependencias de terceros'],bad:'try {\n  guardar(orden);\n} catch(e) { }',good:'try {\n  guardarOrden(orden);\n} catch (error) {\n  throw new Error(`No se guardó la orden ${orden.id}`,\n    { cause: error });\n}',exercise:'Piensa en un error que tu app oculta. ¿Qué mensaje le permitiría al equipo diagnosticarlo?',tip:'Un resultado silencioso puede dificultar la detección de errores.'},
{num:'07',name:'Pruebas de unidad',page:169,tag:'Confiabilidad',concept:'Las pruebas deben ser legibles y proteger comportamientos importantes.',detail:'El capítulo analiza cómo las pruebas mejoran la confianza para cambiar código y cómo su propio diseño también requiere atención. La idea FIRST incluye rapidez, independencia, repetibilidad, autovalidación y oportunidad de ejecución.',principles:['Probar comportamientos observables','Casos repetibles y claros','Una expectativa comprensible por prueba'],bad:'test("prueba1", () => {\n  expect(suma(2, 2)).toBe(4);\n  expect(suma(5, 3)).toBe(8);\n});',good:'test("suma dos números positivos", () => {\n  expect(sumar(2, 2)).toBe(4);\n});\ntest("admite valores distintos", () => {\n  expect(sumar(5, 3)).toBe(8);\n});',exercise:'Escribe una prueba para un caso normal, uno límite y otro de error.',tip:'Las pruebas también son documentación del comportamiento esperado.'},
{num:'08',name:'Clases y diseño',page:185,tag:'Evolución',concept:'Dividir responsabilidades y mantener las dependencias controladas facilita ampliar el sistema.',detail:'En capítulos posteriores se examinan clases, sistemas, diseño emergente y refactorización. El libro valora estructuras cohesivas, diseño que puede evolucionar y revisión continua a partir de casos de estudio.',principles:['Alta cohesión y responsabilidades claras','Separar configuración de lógica','Refactorizar a partir de pruebas'],bad:'class Sistema {\n  enviarCorreo() {}\n  generarFactura() {}\n  autenticar() {}\n}',good:'class ServicioCorreo { enviar() {} }\nclass Facturador { generar() {} }\nclass Autenticador { validar() {} }',exercise:'Dibuja las responsabilidades de una clase de tu proyecto. ¿Está haciendo trabajo de tres módulos?',tip:'No se trata de crear más clases por moda, sino de aclarar las responsabilidades.'}
];
const labs=[
{name:'Nombres que expliquen',subtitle:'Un compañero recibe tu función sin contexto. Dale nombres legibles.',task:'Renombra la función y sus parámetros para expresar que calcula el total de una compra. Mantén su comportamiento.',start:'function p(a, b) {\n  return a * b;\n}',solution:'function calcularTotal(precioUnitario, cantidad) {\n  return precioUnitario * cantidad;\n}',criteria:[{label:'Nombre de función relacionado con el total',test:s=>/function\s+(calcular\w*|obtenerTotal|totalCompra|totalDe\w*)/i.test(s)},{label:'Nombres de parámetros descriptivos (precio y cantidad)',test:s=>/precio/i.test(s)&&/cantidad/i.test(s)},{label:'Conserva la operación de multiplicar',test:s=>/return\s+[^;]*\*/.test(s)}],hint:'La función toma precio unitario y cantidad; su resultado es el total.'},
{name:'Una función, una idea',subtitle:'La función reúne muchas responsabilidades. Puedes dividirlas.',task:'Crea una función principal registrarPedido que delegue validación, cálculo y almacenamiento a funciones con nombres claros.',start:'function registrarPedido(pedido) {\n  if (!pedido.productos.length) throw new Error("Vacío");\n  let total = 0;\n  pedido.productos.forEach(p => total += p.precio);\n  baseDeDatos.insert({ ...pedido, total });\n}',solution:'function registrarPedido(pedido) {\n  validarPedido(pedido);\n  const total = calcularTotal(pedido.productos);\n  guardarPedido({ ...pedido, total });\n}\n\n// Estas funciones auxiliares se definirían por separado.',criteria:[{label:'Incluye validación con nombre claro',test:s=>/validarPedido\s*\(/i.test(s)},{label:'Separa el cálculo de total',test:s=>/calcularTotal\s*\(/i.test(s)},{label:'Separa el almacenamiento',test:s=>/guardarPedido\s*\(/i.test(s)}],hint:'Piensa en tres verbos: validar, calcular y guardar.'},
{name:'Errores con contexto',subtitle:'Atrapar un error sin explicarlo vuelve difícil el diagnóstico.',task:'Cambia el catch vacío por una acción que informe del error; usa throw con un mensaje significativo.',start:'function guardarPerfil(perfil) {\n  try {\n    db.save(perfil);\n  } catch (error) {\n    // Sin acción\n  }\n}',solution:'function guardarPerfil(perfil) {\n  try {\n    db.save(perfil);\n  } catch (error) {\n    throw new Error("No se pudo guardar el perfil", {\n      cause: error\n    });\n  }\n}',criteria:[{label:'Conserva un bloque catch',test:s=>/catch\s*\(/.test(s)},{label:'Comunica el error mediante throw',test:s=>/throw\s+(new\s+Error|error)/.test(s)},{label:'Aporta contexto al mensaje',test:s=>/no se pudo|guardar el perfil|fall[oó]|perfil/i.test(s.split('catch').slice(1).join('catch'))}],hint:'Piensa qué operación falló y escribe ese contexto en la excepción.'},
{name:'Escribe una prueba',subtitle:'Una prueba pequeña describe una expectativa verificable.',task:'Escribe una prueba para descuento(precio, porcentaje) que verifique que el 10% de descuento de 100 da 90. Puedes usar test/expect o assert.',start:'function descuento(precio, porcentaje) {\n  return precio * (1 - porcentaje / 100);\n}\n\n// Agrega tu prueba aquí',solution:'test("aplica un descuento del 10 por ciento", () => {\n  expect(descuento(100, 10)).toBe(90);\n});',criteria:[{label:'Define una prueba con nombre',test:s=>/\b(test|it)\s*\(|\bassert\s*\(/.test(s)},{label:'Invoca descuento con un precio y porcentaje',test:s=>/descuento\s*\(\s*100\s*,\s*10\s*\)/.test(s)},{label:'Comprueba el resultado esperado 90',test:s=>/toBe\s*\(\s*90\s*\)|strictEqual\s*\([^)]*90\s*\)|===\s*90/.test(s)}],hint:'Ejemplo de estructura: test("descripción", () => { expect(...).toBe(...); });'}
];
const bookChapters=['1','2','3','4','5','7 y 8','9','10 a 12'];
const editorDraft=labs.map(l=>l.start);
const quiz=[
{q:'¿Qué define mejor el objetivo de Código limpio?',options:['Escribir la menor cantidad posible de líneas','Escribir código legible y fácil de mantener','Usar siempre el lenguaje más reciente','Comentar cada línea'],correct:1,why:'El libro valora la claridad, el mantenimiento y la evolución del código, no solo su tamaño.'},
{q:'¿Cuál es el nombre más descriptivo para una variable?',options:['x','data2','precioUnitario','a'],correct:2,why:'PrecioUnitario comunica qué contiene la variable sin depender de un comentario.'},
{q:'Una función se vuelve demasiado difícil de entender porque valida, guarda y envía notificaciones. ¿Qué conviene hacer?',options:['Añadir más comentarios','Separar responsabilidades en funciones coherentes','Duplicar el código','Eliminar las validaciones'],correct:1,why:'Separar tareas con nombres significativos hace más clara la intención y facilita probarlas.'},
{q:'¿Qué comentario suele aportar menos valor?',options:['Explicar una regla de negocio externa','Advertir sobre una limitación conocida','Repetir literalmente lo que hace una línea','Explicar una decisión arquitectónica'],correct:2,why:'Cuando el comentario repite código evidente, es más útil mejorar el propio código.'},
{q:'¿Qué beneficio ofrece una indentación coherente?',options:['Aumenta automáticamente el rendimiento','Hace visible la estructura y la relación de los bloques','Sustituye las pruebas','Evita cualquier excepción'],correct:1,why:'El formato es una ayuda para la lectura humana.'},
{q:'¿Qué es problemático en un catch vacío?',options:['Oculta fallos y complica la investigación','Hace más cortas las funciones','Impide declarar variables','Consume más memoria por definición'],correct:0,why:'Los errores silenciosos hacen más difícil saber que una operación falló.'},
{q:'¿Qué práctica caracteriza una buena prueba de unidad?',options:['Depender del orden de otras pruebas','Usar nombres genéricos','Verificar un comportamiento esperado de forma repetible','Omitir las aserciones'],correct:2,why:'Las pruebas legibles y repetibles ayudan a modificar el código con confianza.'},
{q:'¿Qué es la refactorización en este contexto?',options:['Cambiar el comportamiento para añadir nuevas funciones','Reorganizar el código conservando el comportamiento observable','Borrar el código anterior sin revisarlo','Agregar clases a todos los archivos'],correct:1,why:'Refactorizar modifica la estructura interna sin cambiar intencionalmente lo que el usuario observa.'}
];

['Los nombres explican la intención','Se entiende qué significan variables y funciones.'],['Las funciones están enfocadas','Las acciones grandes se dividen en tareas coherentes.'],['No se repite lógica innecesaria','Hay oportunidades de extraer responsabilidades compartidas.'],['Los errores aportan contexto','Las excepciones no se silencian sin razón.'],['El formato es consistente','Los bloques, espacios y agrupaciones ayudan a leer.'],['Existen pruebas de comportamiento','Los casos relevantes cuentan con comprobaciones.'],['Las clases tienen responsabilidades claras','Cada módulo tiene un propósito identificable.']

{title:'Conocer los números',text:'El episodio trata la importancia del flujo de efectivo y de comprender ingresos, gastos y situación financiera.',mine:'Si algún día trabajo de forma independiente, calcularía costos, tiempos y margen antes de aceptar un proyecto.'},
{title:'Disciplina y paciencia',text:'La trayectoria emprendedora se plantea con riesgos reales, trabajo sostenido y decisiones difíciles.',mine:'No esperaría que mi primera aplicación me dé éxito inmediato; intentaría aprender con cada versión.'},

const scenarios=[
{title:'Te piden una cotización',desc:'Un posible cliente solicita una aplicación para su negocio, pero no explica alcance, entregables ni presupuesto.',choices:['Dar un precio muy bajo para ganar rápido','Pedir objetivos, funciones, tiempos y presupuesto antes de cotizar','Ignorar al cliente hasta que envíe algo formal'],best:1,feedback:['Sin información podrías subestimar el trabajo y perder recursos.','Buena decisión: información y preparación ayudan a negociar con mayor claridad.','La falta de comunicación puede cerrar una oportunidad que aún vale la pena analizar.']},
{title:'Quieren que trabajes gratis',desc:'El cliente dice que el proyecto “te dará exposición” y te pide toda la aplicación sin pago.',choices:['Aceptar todo para agradarle','Enojarte y cortar la conversación','Explicar tu propuesta de valor y plantear un alcance piloto pagado'],best:2,feedback:['El trabajo sin acuerdos definidos puede generar problemas para ambas partes.','Defender tu trabajo es importante, pero se pueden explorar alternativas con respeto.','Buena decisión: presentas opciones concretas y defiendes el valor de tu tiempo.']},

const studentOpinion=`Después de revisar los temas de la entrevista de Arturo Elías Ayub en Dimes y Billetes, una de las cosas que más me llamó la atención fue que para negociar no basta con hablar bien o intentar convencer a la otra persona. También hay que investigar, escuchar y saber qué estamos ofreciendo. Como estudiante universitario, relaciono esto con los proyectos en equipo, porque muchas veces aceptamos actividades o fechas sin preguntar bien qué se necesita y después aparecen los problemas.\n\nOtra idea que considero importante es tener orden en las finanzas. A veces uno piensa que emprender consiste principalmente en tener una buena idea, pero también se necesita entender cuánto cuesta llevarla a la práctica, cuáles son los gastos y qué riesgos existen. En mi caso, si algún día quiero desarrollar software por mi cuenta, tendría que aprender a presupuestar y a valorar el tiempo que se dedica a cada proyecto.\n\nTambién me pareció interesante que se hable de la paciencia y de los retos de emprender. Pienso que en la universidad se habla mucho de innovar y crear empresas, pero no siempre se comenta todo el esfuerzo que hay detrás. Me quedo con la idea de que no todos tenemos que iniciar un negocio de inmediato y que primero es importante prepararnos, descubrir qué nos interesa y adquirir experiencia.\n\nFinalmente, el tema de la inteligencia artificial me hace pensar en el futuro de mi carrera. Como estudiante de ingeniería de software, siento que aprender herramientas nuevas es importante, pero también lo es comprender los fundamentos y desarrollar criterio para resolver problemas reales. Mi conclusión es que el éxito profesional no depende solo de ganar dinero: también implica trabajar de forma responsable, cumplir acuerdos, seguir aprendiendo y aportar algo útil a los demás.`;

function route(){return `<div class="eyebrow">01 / EL LIBRO</div><h1 style="margin:18px 0 0">Ruta de <span class="accent">aprendizaje.</span></h1><p class="page-lead">Ocho ideas desarrolladas a partir de capítulos seleccionados del PDF. Cada lección incluye una explicación, comparación de código y una actividad. Abre cualquiera y márcala como aprendida.</p><div class="panel pad flat" style="margin-bottom:18px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b style="font-size:14px">Tu lectura</b><p style="font-size:12px">${saved.read.length} lecciones revisadas de 8</p></div><div style="flex:1;min-width:160px;max-width:370px"><div class="bar"><span style="width:${Math.round(saved.read.length/8*100)}%"></span></div></div><span class="tag green">${Math.round(saved.read.length/8*100)}% COMPLETADO</span></div><div class="topic-grid">${topics.map((t,i)=>`<button class="topic-card" data-topic="${i}"><span class="number">LECCIÓN ${t.num} · PÁG. ${t.page}</span>${saved.read.includes(i)?'<span class="checked">✓ APRENDIDO</span>':''}<h3>${t.name}</h3><p>${t.concept}</p><span class="tag" style="margin-top:16px">${t.tag} ↗</span></button>`).join('')}</div><p class="footnote">Las páginas corresponden al archivo PDF proporcionado. Es una selección de temas, no una reproducción de los 644 folios.</p>`}
function topicDetail(){let t=topics[currentTopic],done=saved.read.includes(currentTopic);return `<div class="chapter-nav"><button class="select-btn" data-nav="ruta">← Todas las lecciones</button><span class="tag green">CAPÍTULO ${bookChapters[currentTopic]} · PÁGINA ${t.page} DEL PDF</span></div><div class="eyebrow">LECCIÓN ${t.num} / ${t.tag.toUpperCase()}</div><h1 style="margin:16px 0 20px">${t.name}<span class="accent">.</span></h1><div class="reading-layout"><div><div class="reading-intro"><span class="tag cyan">IDEA CENTRAL</span><h2 style="font-size:29px">${t.concept}</h2><p>${t.detail}</p></div><div class="section-heading"><div><div class="eyebrow">LECTURA APLICADA</div><h3 style="margin-top:10px">Mismo problema, diferente claridad</h3></div></div><div class="compare"><div><div class="code-label before">✕ Menos claro</div>${printCode(t.bad,'antes.js')}</div><div><div class="code-label after">✓ Más expresivo</div>${printCode(t.good,'despues.js')}</div></div><div class="callout"><b>✦</b><div><strong>Lo que debes observar</strong><br>${t.tip}</div></div><div class="section-heading"><div><div class="eyebrow">HAZLO TUYO</div><h3 style="margin-top:10px">Tu mini desafío</h3></div></div><div class="panel pad flat"><p>${t.exercise}</p><div class="btn-row"><button class="btn" data-action="mark-topic">${done?'✓ Lección completada':'✓ Marcar como aprendida'}</button><button class="btn secondary" data-nav="laboratorio">Ir al laboratorio ↗</button></div></div><div class="btn-row" style="justify-content:space-between"><button class="btn ghost" data-action="previous-topic" ${currentTopic===0?'disabled':''}>← Anterior</button><button class="btn secondary" data-action="next-topic" ${currentTopic===7?'disabled':''}>Siguiente lección →</button></div></div><aside class="reading-side"><div class="panel"><span class="tag cyan">CHECKLIST DE IDEAS</span><ul>${t.principles.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel"><div class="eyebrow">REFERENCIA</div><h4 style="margin:13px 0 7px">Código limpio</h4><p>Robert C. Martin y colaboradores.<br>Capítulo ${bookChapters[currentTopic]} · Página ${t.page} del PDF.</p><p class="footnote">Los fragmentos JavaScript son ejemplos didácticos creados para esta experiencia.</p></div></aside></div>`}
function labView(){const lab=labs[labIndex];const output=labResult&&labResult.id===labIndex?labResult:null;return `<div class="eyebrow">02 / EXPERIMENTA</div><h1 style="margin:17px 0 0">Laboratorio de <span class="accent">refactorización.</span></h1><p class="page-lead">Aquí no basta con leer: modifica el código y presiona <b style="color:white">Analizar</b>. La herramienta revisa patrones concretos; no ejecuta tu código ni reemplaza una revisión profesional.</p><div class="lab-tabs" role="tablist" aria-label="Elegir ejercicio">${labs.map((l,i)=>`<button class="lab-tab ${i===labIndex?'active':''}" role="tab" aria-selected="${i===labIndex}" data-lab="${i}">${saved.labDone.includes(i)?'✓ ':'0'+(i+1)+' / '}${l.name}</button>`).join('')}</div><div class="split"><div><div class="panel pad"><span class="tag orange">DESAFÍO ${labIndex+1} DE 4</span><h3 style="margin:16px 0 9px">${lab.name}</h3><p>${lab.subtitle}</p><div class="tip" style="margin:20px 0 22px"><b>Tu misión:</b> ${lab.task}</div><label for="codeEditor" class="code-label" style="display:block;margin-bottom:11px">EDITOR DE JAVASCRIPT · PUEDES ESCRIBIR</label><textarea spellcheck="false" id="codeEditor" class="editor" aria-label="Editor de código JavaScript">${escapeHtml(editorDraft[labIndex])}</textarea><div class="btn-row"><button class="btn" data-action="analyze">◎ Analizar código</button><button class="btn secondary" data-action="solution">${labShowSolution?'Ocultar':'Ver'} propuesta</button><button class="btn ghost" data-action="reset-lab">↺ Reiniciar</button></div>${labShowSolution?`<div style="margin-top:22px"><div class="code-label after">✓ UNA POSIBLE SOLUCIÓN</div>${printCode(lab.solution,'propuesta.js')}<p class="inline-note">Es una solución de ejemplo; pueden existir otras correctas.</p></div>`:''}${output?`<div style="margin-top:25px"><h4>Resultado de la revisión · ${output.points}/${lab.criteria.length}</h4>${lab.criteria.map((c,i)=>`<div class="result-item ${output.flags[i]?'pass':''}"><span class="status">${output.flags[i]?'✓':'○'}</span><span>${c.label}</span></div>`).join('')}<p class="footnote">${output.points===lab.criteria.length?'¡Buen avance! Las tres comprobaciones de este ejercicio se cumplen.':lab.hint} El análisis es heurístico: una coincidencia no demuestra que el código funcione.</p></div>`:''}</div></div><div><div class="panel pad flat"><span class="tag cyan">CÓMO USARLO</span><h3 style="margin:15px 0 17px">Tu estación de trabajo</h3><ol class="list-plain"><li>Lee el problema y observa el código inicial.</li><li>Modifica directamente el editor.</li><li>Ejecuta el analizador de patrones.</li><li>Compara con una propuesta y mejora tu versión.</li></ol><hr class="divider"><h4>Consejo del libro</h4><p style="margin-top:9px">Refactorizar supone cambios internos para mejorar la estructura preservando el comportamiento observable. En proyectos reales, apóyate en pruebas automatizadas.</p></div><div class="recap" style="margin-top:15px"><span class="tag green">MI PROGRESO</span><h2 style="margin:12px 0 7px">${saved.labDone.length}<span style="color:var(--muted)"> / 4</span></h2><p>Ejercicios con todos los criterios heurísticos cumplidos al menos una vez.</p></div></div></div>`}
function inspectorView(){const selected=inspectorFlags.filter(Boolean).length,score=Math.round(selected/quality.length*100),circ=2*Math.PI*82;return `<div class="eyebrow">03 / AUTOEVALUACIÓN</div><h1 style="margin:17px 0 0">Inspector de <span class="accent">calidad.</span></h1><p class="page-lead">Imagina un proyecto universitario real. Marca los hábitos que ya aplicas y observa una puntuación orientativa que cambia al instante. No es una medición objetiva de tu software.</p><div class="inspector-layout"><div><div class="panel pad"><div class="eyebrow" style="margin-bottom:16px">LISTA DE REVISIÓN</div>${quality.map((q,i)=>`<label class="check-row"><input type="checkbox" data-flag="${i}" ${inspectorFlags[i]?'checked':''}><span><b>${q[0]}</b><small>${q[1]}</small></span></label>`).join('')}<div class="btn-row"><button class="btn secondary" data-action="inspector-all">Marcar todo</button><button class="btn ghost" data-action="inspector-none">Limpiar evaluación</button></div></div></div><div><div class="panel pad" style="text-align:center"><span class="tag green">ÍNDICE ILUSTRATIVO</span><div class="score-ring"><svg viewBox="0 0 200 200" role="img" aria-label="Puntuación orientativa ${score} de 100"><circle cx="100" cy="100" r="82" stroke="#2f4550" fill="none" stroke-width="13"/><circle cx="100" cy="100" r="82" stroke="#b5f45a" fill="none" stroke-width="13" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-score/100)}"/></svg><div class="score-center"><b>${score}</b><small>de 100 puntos</small></div></div><h3>${score>=85?'Bien encaminado':score>=55?'En construcción':'Hay margen de mejora'}</h3><p style="margin-top:13px">${selected} de ${quality.length} prácticas marcadas</p><p class="footnote">Cada casilla aporta el mismo peso. Esta herramienta es una guía de reflexión, no una auditoría automatizada.</p></div><div class="panel pad flat" style="margin-top:15px"><h4>¿En qué me enfoco ahora?</h4><p style="margin-top:11px">${quality.find((q,i)=>!inspectorFlags[i])?.[0]||'Todas las prácticas están marcadas. Revisa si realmente se cumplen en tu código y contrástalas con pruebas y una revisión de equipo.'}</p></div></div></div>`}
function quizView(){const finished=quizAt>=quiz.length;let total=quizSelections.reduce((n,s,i)=>n+(s===quiz[i].correct?1:0),0);if(finished){return `<div class="eyebrow">04 / EVALUACIÓN</div><h1 style="margin:18px 0">Reto <span class="accent">terminado.</span></h1><div class="panel pad" style="max-width:760px;text-align:center;padding:43px 25px"><span class="tag green">RESULTADO</span><div class="final-score" style="margin:21px">${total}<small style="font-size:27px;color:var(--muted)"> / 8</small></div><h2>${total>=7?'¡Excelente comprensión!':total>=5?'Vas por buen camino':'La práctica hace la diferencia'}</h2><p style="margin:16px auto;max-width:470px">${total>=7?'Reconoces principios clave y sabes identificar mejoras frecuentes.':total>=5?'Tienes buena base; revisa las preguntas que fallaste y practica con código.':'Vuelve a las lecciones, prueba el laboratorio y realiza el reto otra vez.'}</p><div class="btn-row" style="justify-content:center"><button class="btn" data-action="restart-quiz">↺ Repetir reto</button><button class="btn secondary" data-nav="ruta">Revisar lecciones</button></div></div><div class="section-heading"><h3>Revisión de respuestas</h3></div>${quiz.map((q,i)=>`<div class="panel pad flat" style="margin-bottom:10px"><span class="tag ${quizSelections[i]===q.correct?'green':'orange'}">${quizSelections[i]===q.correct?'✓ CORRECTA':'○ PARA REPASAR'}</span><h4 style="margin:13px 0 7px">${i+1}. ${q.q}</h4><p>Tu respuesta: ${q.options[quizSelections[i]]}</p><p style="color:var(--green)">Respuesta esperada: ${q.options[q.correct]}</p><p style="font-size:12px">${q.why}</p></div>`).join('')}`}
const item=quiz[quizAt],selected=quizSelections[quizAt];return `<div class="eyebrow">04 / EVALUACIÓN</div><h1 style="margin:17px 0 0">Reto de <span class="accent">conocimientos.</span></h1><p class="page-lead">Ocho situaciones y conceptos del libro. Contesta cada pregunta y recibe una explicación antes de avanzar. Tu mejor resultado se guardará en este navegador.</p><div class="split"><div class="panel pad"><div style="display:flex;justify-content:space-between;gap:12px"><span class="tag green">PREGUNTA ${quizAt+1} DE 8</span><span class="pill-note">MEJOR MARCA ${saved.quizBest}/8</span></div><div class="step-dots">${quiz.map((_,i)=>`<span class="step ${i<=quizAt?'done':''}"></span>`).join('')}</div><h2 class="quiz-question">${item.q}</h2>${item.options.map((ans,i)=>`<button class="quiz-answer ${selected===i?'selected':''} ${selected!==undefined&&(i===item.correct?'correct':i===selected?'wrong':'') }" data-answer="${i}" ${selected!==undefined?'disabled':''}><span class="letter">${'ABCD'[i]}.</span><span>${ans}</span></button>`).join('')}${selected!==undefined?`<div class="feedback"><b style="color:${selected===item.correct?'var(--green)':'var(--orange)'}">${selected===item.correct?'¡Correcto!':'Todavía hay algo que repasar.'}</b><br>${item.why}</div><div class="btn-row"><button class="btn" data-action="next-answer">${quizAt===7?'Ver resultado':'Siguiente pregunta →'}</button></div>`:''}</div><div><div class="panel pad flat"><span class="tag cyan">REGLAS DEL RETO</span><h3 style="margin:14px 0">Aprender, no adivinar.</h3><p>Selecciona una sola opción. Después de responder, aparece una explicación. Al final podrás ver los aciertos y repetir el ejercicio.</p><hr class="divider"><h4>Progreso actual</h4><div class="bar"><span style="width:${Math.round(quizAt/8*100)}%"></span></div><p>${quizAt} preguntas finalizadas.</p></div></div></div>`}
function negotiationView(){return `<div class="eyebrow">05 / APARTADO ESPECIAL</div><h1 style="margin:17px 0 0">Negociar con <span class="accent">criterio.</span></h1><div class="split" style="align-items:start"><a class="neg-video video-cta" href="https://www.youtube.com/watch?v=7vk5PoUUkPc" target="_blank" rel="noopener noreferrer" aria-label="Ver la entrevista completa en YouTube (se abre en otra pestaña)"><span class="video-cta-glow" aria-hidden="true"></span><span class="video-play" aria-hidden="true">▶</span><span class="video-cta-title">Arturo Elías Ayub</span><span class="video-cta-subtitle">Dimes y Billetes · Episodio 318</span><span class="video-cta-button">Ver video en YouTube ↗</span></a><div class="panel pad flat"><span class="tag cyan">ENTREVISTA · 2025</span><h3 style="margin:15px 0 9px">Arturo Elías Ayub × Moris Dieck</h3><p>La descripción oficial del episodio aborda experiencia emprendedora, negociación, finanzas personales, desafíos de negocio y proyectos futuros.</p><p style="font-size:12px;margin-top:13px">Dimes y Billetes · Episodio 318 · 5 de marzo de 2025 · aproximadamente 1 h 24 min</p><div class="btn-row"><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=7vk5PoUUkPc">Abrir en YouTube ↗</a></div></div></div><div class="section-heading"><div><div class="eyebrow">IDEAS PARA LLEVAR A LA PRÁCTICA</div><h2 style="margin-top:10px">Lo que me llevo.</h2></div><span class="minor">PULSA CADA IDEA</span></div><div class="grid2"><div>${negPoints.slice(0,2).map((p,i)=>negPoint(p,i)).join('')}</div><div>${negPoints.slice(2).map((p,i)=>negPoint(p,i+2)).join('')}</div></div><div class="section-heading"><div><div class="eyebrow">SIMULADOR DE DECISIONES</div><h2 style="margin-top:10px">Tu primera negociación.</h2></div><span class="tag orange">CASO FICTICIO · SOFTWARE</span></div>${negScenario()}<div class="section-heading" id="opinion"><div><div class="eyebrow">REFLEXIÓN REDACTADA CON VOZ UNIVERSITARIA</div><h2 style="margin-top:10px">Mi opinión del video.</h2></div></div><div class="opinion"><span class="tag green" style="margin-bottom:17px">OPINIÓN PERSONAL · EJEMPLO PARA ESTUDIANTE</span><h3>Lo que entendí y cómo lo relaciono con mi carrera</h3>${studentOpinion.split('\n\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`}
function negPoint(p,i){return `<div><button class="point" data-point="${i}"><span class="n">0${i+1}</span><div><h4>${p.title}</h4><p>${p.text}</p></div><span style="margin-left:auto;color:var(--aqua)">${lessonOpen===i?'−':'+'}</span></button>${lessonOpen===i?`<div class="point-expanded"><b style="color:var(--green)">Cómo lo aplicaría:</b> ${p.mine}</div>`:''}</div>`}
function negScenario(){if(scenarioAt>=scenarios.length){const pts=scenarioAnswers.filter((a,i)=>a===scenarios[i].best).length;return `<div class="panel pad split"><div><span class="tag green">SIMULACIÓN FINALIZADA</span><h2 style="margin:16px 0">${pts} de 3 buenas decisiones</h2><p>Este ejercicio plantea situaciones ficticias inspiradas en los temas generales de preparación, comunicación y negociación. No reproduce una negociación real de la entrevista.</p><div class="btn-row"><button class="btn" data-action="restart-neg">↺ Volver a negociar</button></div></div><div class="recap"><h4>Idea para tu vida profesional</h4><p>Investiga antes de aceptar, comunica lo que puedes entregar y plantea alternativas viables. No se trata solo de conseguir un “sí”, sino de construir acuerdos sostenibles.</p></div></div>`}
const s=scenarios[scenarioAt],chosen=scenarioAnswers[scenarioAt];return `<div class="panel pad split"><div><span class="tag orange">SITUACIÓN ${scenarioAt+1}/3</span><h3 style="margin:15px 0 10px">${s.title}</h3><p>${s.desc}</p><div style="margin-top:20px">${s.choices.map((c,i)=>`<button class="quiz-answer ${chosen===i?'selected':''} ${chosen!==undefined&&(i===s.best?'correct':chosen===i?'wrong':'')}" data-neg-answer="${i}" ${chosen!==undefined?'disabled':''}><span class="letter">${'ABC'[i]}.</span><span>${c}</span></button>`).join('')}</div>${chosen!==undefined?`<div class="feedback"><b style="color:${chosen===s.best?'var(--green)':'var(--orange)'}">${chosen===s.best?'Decisión recomendable':'Para reflexionar'}</b><br>${s.feedback[chosen]}</div><div class="btn-row"><button class="btn" data-action="next-neg">${scenarioAt===2?'Ver mi resultado':'Continuar negociación →'}</button></div>`:''}</div><div class="recap"><div class="eyebrow">CONTEXTO</div><h3 style="margin:15px 0 12px">Una app para un pequeño negocio</h3><p>Imagina que estudias Ingeniería de Software y una persona te contacta para desarrollar su primer sistema de ventas. Tus respuestas construyen el camino de la conversación.</p><div class="step-dots" style="margin-top:22px">${scenarios.map((_,i)=>`<span class="step ${i<=scenarioAt?'done':''}"></span>`).join('')}</div><p class="inline-note">Este caso es un ejercicio didáctico creado para la aplicación.</p></div></div>`}
function conclusionView(){return `<div class="eyebrow">06 / CIERRE</div><h1 style="margin:17px 0 0">Lo importante es <span class="accent">seguir mejorando.</span></h1><p class="page-lead">El objetivo de esta experiencia no es memorizar reglas, sino formar hábitos que se puedan aplicar en proyectos universitarios y, después, en equipos de desarrollo.</p><div class="grid2"><div class="panel pad"><span class="tag cyan">DESDE EL LIBRO</span><h3 style="margin:15px 0 11px">Qué significa escribir código limpio</h3><p>Para mí, lo más valioso de <em>Código limpio</em> es comprender que un programa no termina cuando ejecuta correctamente. También debe ser entendible para las personas que lo van a revisar, corregir o ampliar. Tener nombres claros, separar tareas, escribir pruebas y cuidar los errores son decisiones que pueden ahorrar tiempo y confusión en proyectos reales.</p></div><div class="panel pad"><span class="tag green">EN LA UNIVERSIDAD</span><h3 style="margin:15px 0 11px">Cómo lo aplicaría como estudiante</h3><p>En las actividades de equipo empezaría por revisar nombres y funciones antes de entregar; también intentaría agregar pruebas para los casos importantes. Considero que escribir de forma ordenada demuestra respeto por el trabajo de los demás y por el tiempo que se invierte después en mantener el proyecto.</p></div></div><div class="section-heading"><h2>Mi compromiso práctico.</h2></div><div class="panel pad flat"><div class="grid3">${[['01','Antes de entregar','Revisar nombres y eliminar duplicaciones evidentes.'],['02','Antes de modificar','Comprender el comportamiento y, cuando sea posible, respaldarlo con pruebas.'],['03','Después de cada mejora','Dejar una explicación clara del cambio y conservar una estructura legible.']].map(x=>`<div><div style="font:800 24px 'JetBrains Mono',monospace;color:var(--green)">${x[0]}</div><h4 style="margin:10px 0">${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div></div><div class="recap" style="margin-top:19px"><span class="tag cyan">RESUMEN DE MI EXPERIENCIA</span><h3 style="margin:16px 0">${saved.read.length}/8 lecciones · ${saved.labDone.length}/4 prácticas · ${saved.quizBest}/8 mejor reto</h3><p>Puedes volver a cualquier lección y seguir mejorando. El progreso de las lecciones, el laboratorio y el quiz se almacena localmente en este navegador, cuando está permitido.</p><div class="btn-row"><button class="btn" data-nav="ruta">Continuar aprendiendo ↗</button><button class="btn secondary" data-nav="negociacion">Ver reflexión de negociación</button></div></div>`}

function render(){updateProgress();let html;switch(page){case'inicio':html=home();break;case'ruta':html=route();break;case'topico':html=topicDetail();break;case'laboratorio':html=labView();break;case'inspector':html=inspectorView();break;case'quiz':html=quizView();break;case'negociacion':html=negotiationView();break;case'conclusion':html=conclusionView();break;default:html=home();}$('#content').innerHTML=html;}
function downloadText(name,txt){const b=new Blob([txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
document.addEventListener('click',async e=>{const target=e.target.closest('[data-nav],[data-topic],[data-lab],[data-answer],[data-neg-answer],[data-point],[data-action]');if(!target)return;
if(target.dataset.nav){nav(target.dataset.nav);return}
if(target.dataset.topic!==undefined){currentTopic=Number(target.dataset.topic);page='topico';$('#crumb').textContent='Lecciones / '+topics[currentTopic].name;render();window.scrollTo(0,0);return}
if(target.dataset.lab!==undefined){const ed=$('#codeEditor');if(ed)editorDraft[labIndex]=ed.value;labIndex=Number(target.dataset.lab);labResult=null;labShowSolution=false;render();return}
if(target.dataset.answer!==undefined){if(quizSelections[quizAt]!==undefined)return;quizSelections[quizAt]=Number(target.dataset.answer);render();return}
if(target.dataset.negAnswer!==undefined){if(scenarioAnswers[scenarioAt]!==undefined)return;scenarioAnswers[scenarioAt]=Number(target.dataset.negAnswer);render();return}
if(target.dataset.point!==undefined){let old=window.scrollY;lessonOpen=lessonOpen===Number(target.dataset.point)?null:Number(target.dataset.point);render();window.scrollTo(0,old);return}
const act=target.dataset.action;
if(act==='mark-topic'){if(!saved.read.includes(currentTopic)){saved.read.push(currentTopic);persist();notify('¡Lección marcada como aprendida!')}else notify('Ya habías completado esta lección');render()}
if(act==='previous-topic'||act==='next-topic'){currentTopic+=act==='next-topic'?1:-1;currentTopic=Math.max(0,Math.min(topics.length-1,currentTopic));$('#crumb').textContent='Lecciones / '+topics[currentTopic].name;render();window.scrollTo(0,0)}
if(act==='analyze'){const val=$('#codeEditor').value;editorDraft[labIndex]=val;const flags=labs[labIndex].criteria.map(c=>c.test(val));const points=flags.filter(Boolean).length;labResult={id:labIndex,flags,points};if(points===3&&!saved.labDone.includes(labIndex)){saved.labDone.push(labIndex);persist();notify('¡Ejercicio completado según los criterios!')}render();const area=$('#codeEditor');area.focus();area.setSelectionRange(area.value.length,area.value.length)}
if(act==='solution'){editorDraft[labIndex]=$('#codeEditor').value;labShowSolution=!labShowSolution;render()}
if(act==='reset-lab'){editorDraft[labIndex]=labs[labIndex].start;labResult=null;labShowSolution=false;render();notify('Editor restaurado')}
if(act==='inspector-all'){inspectorFlags=quality.map(()=>true);render()}
if(act==='inspector-none'){inspectorFlags=quality.map(()=>false);render()}
if(act==='next-answer'){quizAt++;if(quizAt===quiz.length){const score=quizSelections.reduce((v,a,i)=>v+(a===quiz[i].correct?1:0),0);if(score>saved.quizBest){saved.quizBest=score;persist();notify('Nueva mejor marca en el reto')}}render();window.scrollTo(0,0)}
if(act==='restart-quiz'){quizAt=0;quizSelections=[];render();window.scrollTo(0,0)}
if(act==='next-neg'){scenarioAt++;if(scenarioAt===scenarios.length){const score=scenarioAnswers.filter((a,i)=>a===scenarios[i].best).length;if(score>saved.negBest){saved.negBest=score;persist()}}render();window.scrollTo({top:Math.max(0,$('.section-heading')?.offsetTop||0)-50,behavior:'smooth'})}
if(act==='restart-neg'){scenarioAt=0;scenarioAnswers=[];render()}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-flag]')){inspectorFlags[Number(e.target.dataset.flag)]=e.target.checked;const focused=Number(e.target.dataset.flag);render();$('#content').querySelector(`[data-flag="${focused}"]`)?.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='codeEditor')editorDraft[labIndex]=e.target.value});
render();
</script>
</body>
</html>
